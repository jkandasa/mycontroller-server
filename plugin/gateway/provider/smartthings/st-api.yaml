  LimitAction:
    type: object
    properties:
      count:
        description: Number of times the action can execute within the period
        type: integer
      period:
        description: The period of time
        type: string
        enum:
        - Hour
        - Day
        - Week
        - Month
        - Lifetime
      actions:
        type: array
        items:
          $ref: '#/definitions/Action'
      sequence:
        $ref: '#/definitions/ActionSequence'
    required:
    - count
    - period
    - actions
  LocationAction:
    type: object
    properties:
      locationId:
        description: locationId is required for "User level rule". (It's optional
          for "Location level rule")
        type: string
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
      mode:
