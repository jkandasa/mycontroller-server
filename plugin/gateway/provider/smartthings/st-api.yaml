  TTSBody:
    type: object
    required:
    - text
    - languageCode
    - voiceId
    properties:
      text:
        type: string
        description: Text to be converted to audio. Cannot exceed 2000 characters
          for Polly and 425 characters for Bixby
      languageCode:
        type: string
        description: Language used for the text to be converted to speech. Please
          refer tts/info API to get the options available
      voiceId:
        type: string
        description: VoiceId to be used for the text. Please refer tts/info API to
          get the options available
      audioFormat:
        type: string
        description: Audio format of the audio file, default to mp3 when ttsProvider
          is Amazon Polly, default to pcm when ttsProvider is Bixby. Amazon Polly
          supports mp3 and pcm. Bixby supports only pcm.
        enum:
        - mp3
        - pcm
      ttsProvider:
        type: string
        description: TTS provider to use for converting text to speech, default to
          polly
        enum:
        - polly
        - bixby
      engine:
        type: string
        description: TTS engine to be used, default to standard, standard - robotic
          voice, neural - human like and natural voice. This option is available only
          when ttsProvider is Amazon Polly. Please refer tts/info API to get the options
          available
        enum:
        - standard
        - neural
      speakingStyle:
        type: string
        description: Speaking style to be used. This option is available only when
          ttsProvider is Amazon Polly, engine is neural, and voiceIds are one of the
          following - Matthew, Joanna, Lupe. Please refer tts/info API to get the
          options available
        enum:
        - news
        - conversational
    example:
      text: Hi Samsung SmartThings! This is the text to speech service
      languageCode: en-US
      voiceId: Matthew
      audioFormat: mp3
      ttsProvider: polly
      engine: neural
      speakingStyle: conversational
  PlaytextBody:
    type: object
    required:
    - deviceId
    - text
    - languageCode
    - voiceId
    properties:
      deviceId:
        type: string
        description: Device ID of device on which the audio should be played. Device
          must support audioNotification capability.
      text:
        type: string
        description: Text to be converted to audio. Cannot exceed 2000 characters
          for Polly and 425 characters for Bixby
      languageCode:
        type: string
        description: Language used for the text to be converted to speech. Please
          refer tts/info API to get the options available
      voiceId:
        type: string
        description: VoiceId to be used for the text. Please refer tts/info API to
          get the options available
      audioFormat:
        type: string
        description: Audio format of the audio file, default to mp3 when ttsProvider
          is Amazon Polly, default to pcm when ttsProvider is Bixby. Amazon Polly
          supports mp3 and pcm. Bixby supports only pcm.
        enum:
        - mp3
        - pcm
      ttsProvider:
        type: string
        description: TTS provider to use for converting text to speech, default to
          polly
        enum:
        - polly
        - bixby
      engine:
        type: string
        description: TTS engine to be used, default to standard, standard - robotic
          voice, neural - human like and natural voice. This option is available only
          when ttsProvider is Amazon Polly. Please refer tts/info API to get the options
          available
        enum:
        - standard
        - neural
      speakingStyle:
        type: string
        description: Speaking style to be used. This option is available only when
          ttsProvider is Amazon Polly, engine is neural, and voiceIds are one of the
          following - Matthew, Joanna, Lupe. Please refer tts/info API to get the
          options available
        enum:
        - news
        - conversational
      volume:
        type: integer
        description: Volume of the device at which the audio notification will be
          played
        minimum: 0
        maximum: 100
    example:
      deviceId: 44dd1e8d-19df-5715-cd44-5cff17a552ee
      text: Hi Samsung SmartThings! This is the text to speech service
      languageCode: en-US
      voiceId: Matthew
      audioFormat: mp3
      ttsProvider: polly
      engine: neural
      speakingStyle: conversational
      volume: 50
  ConvertedTTS:
    type: object
    required:
    - message
    - audioURL
    properties:
      message:
        type: string
        description: message to indicate success
      audioURL:
        type: string
        description: Audio URL
    example:
      message: Successfully created an audio file
      audioURL: https://generic-tts-prod.s3.amazonaws.com/polly/6f546dd37587382fdafd7eb8a68d15e833efc8ed7278b17bc8ceece20ce70876.mp3
  PlayedText:
    type: object
    required:
    - message
    properties:
      message:
        type: string
        description: message to indicate success
    example:
      message: Audio played on device successfully
  TTSInfo:
    type: object
    required:
    - voices
    properties:
      voices:
        type: array
        description: Voices supported by the TTS service
        items:
          type: object
          description: Options available for each voice
          required:
          - Gender
          - Id
          - LanguageCode
          - LanguageName
          - Name
          - TTSProvider
          properties:
            Gender:
              type: string
              description: Gender of the voice
              enum:
              - Female
              - Male
            Id:
              type: string
              description: Voice id of the voice
            LanguageCode:
              type: string
              description: Language code of the voice
            LanguageName:
              type: string
              description: Language of the voice
            Name:
              type: string
              description: Name of the voice
            SupportedEngines:
              type: array
              description: Supported engines for the voice. This option will be available
                only when TTSProvider is Amazon Polly
              items:
                type: string
                enum:
                - neural
                - standard
            TTSProvider:
              type: string
              description: TTS provider for the voice
              enum:
              - bixby
              - polly
            SpeakingStyle:
              type: array
              description: Supported speaking styles for the voice.  This option will
                be available only when TTSProvider is Amazon Polly, engine is neural,
                and voiceIds are one of the following - Matthew, Joanna, Lupe
              items:
                type: string
                enum:
                - news
                - conversational
    example:
      voices:
      - Gender: Female
        Id: Joanna
        LanguageCode: en-US
        LanguageName: US English
        Name: Joanna
        SupportedEngines:
        - neural
        - standard
        TTSProvider: polly
        SpeakingStyle:
        - news
        - conversational
      - Gender: Male
        Id: Maxim
        LanguageCode: ru-RU
        LanguageName: Russian
        Name: Maxim
        SupportedEngines:
        - standard
        TTSProvider: polly
      - Gender: Female
        Id: Lupe
        LanguageCode: es-US
        LanguageName: US Spanish
        Name: Lupe
        SupportedEngines:
        - neural
        - standard
        TTSProvider: polly
        SpeakingStyle:
        - news
      - Gender: Female
        Id: F05
        LanguageCode: en-US
        LanguageName: USA
        Name: Lisa
        TTSProvider: bixby
