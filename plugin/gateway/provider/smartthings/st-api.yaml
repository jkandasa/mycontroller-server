    - type: object
      properties:
        then:
          type: array
          items:
            $ref: '#/definitions/Action'
        else:
          type: array
          items:
            $ref: '#/definitions/Action'
        sequence:
          description: The sequence in which the actions are to be executed
          $ref: '#/definitions/IfActionSequence'
  CommandAction:
    type: object
    properties:
      devices:
        type: array
        items:
          type: string
          format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
      commands:
        type: array
        items:
          $ref: '#/definitions/DeviceCommand'
      sequence:
        description: The sequence in which the commands are to be executed i.e. Serial
          or Parallel (default)
        $ref: '#/definitions/CommandSequence'
    required:
    - devices
    - commands
