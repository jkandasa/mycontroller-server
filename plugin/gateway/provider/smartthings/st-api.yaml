        description: The time zone ID for this Rule. This overrides the Location time
          zone ID, but is overridden by time zone ID provided by each operand individually.
        type: string
  Rule:
    allOf:
    - $ref: '#/definitions/RuleRequest'
    - type: object
      required:
      - id
      - ownerType
      - ownerId
      - dateCreated
      - dateUpdated
      properties:
        id:
          description: Unique id for the Rule
          type: string
          format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        status:
          description: The status of the Rule
          type: string
          enum:
          - Enabled
          - Disabled
          default: Enabled
        executionLocation:
          description: The location where the rule is executing, either local or cloud
          readOnly: true
          type: string
          enum:
          - Cloud
          - Local
        ownerId:
          description: Owner id
          type: string
        ownerType:
          description: The owner of the rule is either a location or user
          type: string
          enum:
          - Location
          - User
          default: Location
        creator:
          $ref: '#/definitions/Creator'
        dateCreated:
          description: Created date time
          type: string
        dateUpdated:
          description: Last updated date time
          type: string
        allowed:
          type: array
          items:
            type: string
            uniqueItems: true
          enum:
          - w:rules
          - x:rules
          - d:rules
          description: |
            List of client-facing action identifiers that are currently permitted for the user.
            If the value of this property is not null, then any action not included in the list value of the property is currently prohibited for the user.
            If the value of this property is null (or absent), then no permission-related information is being provided.
              <ul>
              <li> w:rules - the user can edit the rule
              <li> x:rules - the user can execute the rule
              <li> d:rules - the user can delete the rule
              </ul>
  Action:
    type: object
    properties:
      if:
        $ref: '#/definitions/IfAction'
      sleep:
        $ref: '#/definitions/SleepAction'
      command:
        $ref: '#/definitions/CommandAction'
      scene:
        $ref: '#/definitions/SceneAction'
      every:
        $ref: '#/definitions/EveryAction'
      location:
