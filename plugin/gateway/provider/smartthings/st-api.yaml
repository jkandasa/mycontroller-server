                Method or methods allowed when accessing the resource in response to a preflight request
            Access-Control-Allow-Headers:
              type: string
              description: Indicate which HTTP headers can be used during the actual
                request
          schema:
            $ref: '#/definitions/PlayedText'
  /installedapps/{installedAppId}/alias/{aliasName}:
    put:
      tags:
      - InstalledApp
      description: |
        Create or update a coordinate alias for an InstalledApp.

        Authorization: Bearer token must have the following principal format:
        `"principal": "installedapp:<installedAppId>:<locationId>"`

        The token must be principaled to the same InstalledApp ID as the
        `{installedAppId}` path parameter.
      operationId: putInstalledAppCoordinateAlias
      security:
      - Bearer:
        - r:weather
        InstalledAppToken: [
          ]
      parameters:
      - $ref: '#/parameters/installedAppId'
      - $ref: '#/parameters/aliasName'
      - $ref: '#/parameters/authorization'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/InstalledAppAliasCoordinateBody'
      responses:
        default:
          $ref: '#/responses/defaultResponse'
        '400':
          $ref: '#/responses/badRequest'
        '401':
          $ref: '#/responses/notAuthenticated'
        '404':
          $ref: '#/responses/notFound'
        '204':
          description: Success
    delete:
      tags:
      - InstalledApp
      description: |
        Delete a coordinate alias for an InstalledApp.

        Authorization: Bearer token must have the following principal format:
        `"principal": "installedapp:<installedAppId>:<locationId>"`

        The token must be principaled to the same InstalledApp ID as the
        `{installedAppId}` path parameter.
      operationId: deleteInstalledAppCoordinateAlias
      security:
      - Bearer:
        - r:weather
        InstalledAppToken: [
          ]
      parameters:
      - $ref: '#/parameters/installedAppId'
      - $ref: '#/parameters/aliasName'
      - $ref: '#/parameters/authorization'
      responses:
        default:
          $ref: '#/responses/defaultResponse'
        '400':
          $ref: '#/responses/badRequest'
        '401':
          $ref: '#/responses/notAuthenticated'
        '404':
          $ref: '#/responses/notFound'
        '204':
          description: Success
  /installedapps/{installedAppId}/alias/{aliasName}/capability:
    get:
      tags:
      - InstalledApp
      description: |
        Get capability data for an InstalledApp coordinate alias.

        Authorization: Bearer token must have the following principal format:
        `"principal": "installedapp:<installedAppId>:<locationId>"`

        The token must be principaled to the same InstalledApp ID as the
        `{installedAppId}` path parameter.
      operationId: getInstalledAppCoordinateAliasCapability
      security:
      - Bearer:
        - r:weather
        InstalledAppToken: [
          ]
      parameters:
      - $ref: '#/parameters/installedAppId'
      - $ref: '#/parameters/aliasName'
      - $ref: '#/parameters/authorization'
      - in: query
        name: name
        type: string
        required: true
        description: Comma-separated capability names (e.g., weather,airQuality)
      responses:
        default:
          $ref: '#/responses/defaultResponse'
        '400':
          $ref: '#/responses/badRequest'
        '401':
          $ref: '#/responses/notAuthenticated'
        '404':
          $ref: '#/responses/notFound'
        '200':
          description: Success
          schema:
            type: object
  /hubdevices/{hubDeviceId}/channels:
    get:
      summary: Retrieves the list of driver channels
      operationId: listDriverChannels
      description: |
        Returns the list of driver channels the hub is currently subscribed to.
        Currently only returns the `driver` channel type
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubDeviceId'
      - $ref: '#/parameters/Accept-Language'
      - $ref: '#/parameters/channelType'
      security:
      - Bearer:
        - r:channels:*
        - mobile
      responses:
        200:
          description: Channels Subscribed to by Hub
          schema:
            $ref: '#/definitions/HubDriverChannels'
        400:
          $ref: '#/responses/badRequest'
        403:
          $ref: '#/responses/notAuthorized'
  /hubdevices/{hubDeviceId}/drivers:
    get:
      summary: Retrieves the list of hub installed driver
      operationId: listHubInstalledDrivers
      description: Returns the list of drivers currently installed on the hub
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubDeviceId'
      - $ref: '#/parameters/Accept-Language'
      - name: deviceId
        in: query
        type: string
        required: false
        description: optional filter to only return installed drivers that can be
          used by the passed in device
      security:
      - Bearer:
        - r:drivers:*
        - mobile
        - w:devices:*
      responses:
        200:
          description: List of hub installed drivers
          schema:
            $ref: '#/definitions/InstalledDrivers'
        400:
          $ref: '#/responses/badRequest'
        403:
          $ref: '#/responses/notAuthorized'
  /hubdevices/{hubDeviceId}/childdevice/{deviceId}:
    patch:
      summary: Update Device Record For Hub Device
      operationId: updateHubDevice
      description: Updates a hub device record (Widget Backed)
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubDeviceId'
      - $ref: '#/parameters/deviceId'
      - name: forceUpdate
        in: query
        type: boolean
        required: false
        description: |
          A flag that is used to indicate that the driver and profile should be updated even if the fingerprinting process
          fails. Additionally, forceUpdate is required when a new device integration profile key is provided in
          the request payload.
      - name: updateHubDeviceRequest
        in: body
        required: true
        schema:
          $ref: '#/definitions/EdgeDeviceUpdateRequest'
      security:
      - Bearer:
        - w:devices:*
        - mobile
      responses:
        204:
          description: Successful creation of resource with no-content to return
        400:
          $ref: '#/responses/badRequest'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        429:
          $ref: '#/responses/tooManyRequests'
  /hubdevices/{hubDeviceId}/drivers/{driverId}:
    put:
      summary: Install Drivers
      operationId: installDrivers
      description: |
        Install Driver on a Hub. The primary use case of this functionality is to install
        a self published driver to be included in generic discovery (e.g. scanning).
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubDeviceId'
      - $ref: '#/parameters/driverId'
      - name: installDriverRequest
        in: body
        required: false
        schema:
          $ref: '#/definitions/InstallDriverRequest'
      security:
      - Bearer:
        - w:hubs:*
        - w:devices:*
      responses:
        200:
          description: Successful creation of resource with no-content to return
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        429:
          $ref: '#/responses/tooManyRequests'
    delete:
      summary: Uninstall Driver
      operationId: uninstallDriver
      description: |
        Removes a driver from being defaultly installed on a hub. This will allow the hub to clean up the
        deleted driver. However all dependent devices need to be removed for cleanup to fully occur.
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubDeviceId'
      - $ref: '#/parameters/driverId'
      security:
      - Bearer:
        - w:hubs:*
        - mobile
        - w:devices:*
      responses:
        204:
          description: Successful deletion of resource with no-content to return
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        429:
          $ref: '#/responses/tooManyRequests'
    get:
      summary: Get Driver in use by Hub Device
      operationId: getHubDeviceDriver
      description: Returns the specific driver revision information of the driver
        that is in use by a hub
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubDeviceId'
      - $ref: '#/parameters/driverId'
      security:
      - Bearer:
        - r:devices:*
        - mobile
        - w:devices:*
      responses:
        200:
          description: Installed Driver Information
          schema:
            $ref: '#/definitions/InstalledDriver'
        400:
          $ref: '#/responses/badRequest'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        429:
          $ref: '#/responses/tooManyRequests'
  /hubdevices/eui/{hubEui}:
    delete:
      summary: Delete a Hub
      operationId: deleteHubByEui
      description: |
        Delete a hub by eui
      tags:
      - HubDevices
      parameters:
      - $ref: '#/parameters/authorization'
      - $ref: '#/parameters/hubEui'
      security:
      - Bearer:
        - w:hubs:*
        - mobile
        - w:devices:*
      responses:
        204:
          description: Successful deletion of resource with no-content to return
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        404:
          $ref: '#/responses/notFound'
        429:
          $ref: '#/responses/tooManyRequests'
  /drivers:
    get:
      summary: List Drivers
      operationId: listDrivers
      description: Lists drivers owned by user
      tags:
      - Drivers
      parameters:
      - $ref: '#/parameters/driverIds'
      security:
      - Bearer:
        - r:drivers:*
      responses:
        200:
          description: Retrieves paged drivers
          schema:
            $ref: '#/definitions/PagedDrivers'
  /drivers/default:
    get:
      summary: Get Current Default Drivers
      operationId: getDefaultDrivers
      description: |
        Returns driver records for all drivers in the current default channel. These drivers are the set
        that are automatically matched against during device join events and will be automatically installed
      tags:
      - Drivers
      security:
      - Bearer:
        - r:drivers:*
      responses:
        200:
          description: Retrieves paged drivers
          schema:
            $ref: '#/definitions/PagedDrivers'
  /drivers/{driverId}:
    parameters:
    - $ref: '#/parameters/driverId'
    delete:
      summary: Delete Driver
      operationId: deleteDriver
      description: Deletes a driver by identifier
      tags:
      - Drivers
      security:
      - Bearer:
        - w:drivers:*
      responses:
        204:
          description: Driver deleted
    get:
      summary: Get Driver
      operationId: getDriver
      description: Retrieves a driver by identifier. Will return the latests version
        of driver
      tags:
      - Drivers
      security:
      - Bearer:
        - r:drivers:*
      responses:
        200:
          description: Retrieved driver
          schema:
            $ref: '#/definitions/Driver'
  /drivers/{driverId}/versions/{version}:
    parameters:
    - $ref: '#/parameters/driverId'
    - $ref: '#/parameters/driverVersion'
    get:
      summary: Get Driver Revision
      operationId: getDriverRevision
      description: Retrieves a specific revision of a driver
      tags:
      - Drivers
      security:
      - Bearer:
        - r:drivers:*
      responses:
        200:
          description: Retrieved driver
          schema:
            $ref: '#/definitions/Driver'
  /drivers/package:
    post:
      parameters:
      - name: DriverPackage
        in: body
        description: Zip file containing driver package
        required: true
        schema:
          type: string
          format: binary
      summary: Upload Package
      operationId: uploadDriverPackage
      description: |
        Consumes driver package (`.zip`) that contains driver and profile definitions. The layout of the compressed
        ZIP package should reflect the following structure and files definitions.

        `config.yaml`
        `fingerprints.yaml` (Optional, should not be included in packages for Drivers that donâ€™t define fingerprints)
        `src/` (`init.lua`, `...`)
        `profiles/` (`{ Profile Name }.yaml`, `{ Other Profile Name }.yaml`)
      tags:
      - Drivers
      security:
      - Bearer:
        - w:drivers:*
      responses:
        200:
          description: Retrieved driver
          schema:
            $ref: '#/definitions/Driver'
  /distchannels:
    parameters:
    - $ref: '#/parameters/authorization'
    post:
      summary: Create a channel
      operationId: createChannel
      description: Create a channel for the user making the request
      parameters:
      - name: Channel
        in: body
        required: true
        schema:
          $ref: '#/definitions/BasicChannel'
      tags:
      - Channels
      security:
      - Bearer:
        - w:channels:*
      responses:
        200:
          description: Newly created channel
          schema:
            $ref: '#/definitions/DetailedChannel'
    get:
      summary: List channels
      operationId: listChannels
      description: List channels for the authenticated user, optionally filtering
        by subscriber type and subsciber ID
      tags:
      - Channels
      parameters:
      - $ref: '#/parameters/channelSubscriberType'
      - $ref: '#/parameters/channelSubscriberId'
      - $ref: '#/parameters/includeReadOnly'
      security:
      - Bearer:
        - r:channels:*
        - r:hubs:*
      responses:
        200:
          description: List of channels associated with the user, optionally filtered
          schema:
            $ref: '#/definitions/PagedDetailedChannels'
  /distchannels/{channelId}:
    parameters:
    - $ref: '#/parameters/authorization'
    - $ref: '#/parameters/channelId'
    get:
      summary: Get a channel by ID
      operationId: channelById
      description: Get channel details by channel ID
      tags:
      - Channels
      security:
      - Bearer:
        - r:channels:*
      responses:
        200:
          description: Channel details
          schema:
            $ref: '#/definitions/DetailedChannel'
    put:
      parameters:
      - $ref: '#/parameters/authorization'
      - name: ChannelUpdate
        in: body
        required: true
        schema:
          $ref: '#/definitions/PatchChannel'
      summary: Update a channel
      operationId: updateChannel
      description: Update a channel by channel ID
      tags:
      - Channels
      security:
      - Bearer:
        - w:channels:*
      responses:
        200:
          description: Channel details
          schema:
            $ref: '#/definitions/DetailedChannel'
    delete:
      summary: Delete a channel
      operationId: deleteChannel
      description: Delete a channel by channel ID
      tags:
      - Channels
      security:
      - Bearer:
        - w:channels:*
      responses:
        204:
          description: Channel deleted successfully
  /distchannels/{channelId}/drivers:
    parameters:
    - $ref: '#/parameters/authorization'
    - $ref: '#/parameters/channelId'
    post:
      parameters:
      - name: DriverRevision
        in: body
        required: true
        schema:
          $ref: '#/definitions/DriverRevision'
      summary: Assign driver to channel
      operationId: createDriverChannel
      description: Assign a specific driver and version to a channel
      tags:
      - Channels
      security:
      - Bearer:
        - w:channels:*
      responses:
        200:
          description: Driver channel details
          schema:
            $ref: '#/definitions/DriverChannel'
    get:
      summary: List drivers assigned to channel
      operationId: getChannelDrivers
      description: Get a list of drivers assigned to the channel
      tags:
      - Channels
      security:
      - Bearer:
        - r:channels:*
      responses:
        200:
          description: List of drivers associated with the channel
          schema:
            $ref: '#/definitions/PagedDriverChannels'
  /distchannels/{channelId}/drivers/{driverId}:
    parameters:
    - $ref: '#/parameters/authorization'
    - $ref: '#/parameters/channelId'
    - $ref: '#/parameters/driverId'
    get:
      summary: Retrieve a driver channel
      operationId: getDriverChannel
      description: Retrieve details for a specific driver channel
      tags:
      - Channels
      security:
      - Bearer:
        - r:channels:*
      responses:
        200:
          description: Driver channel details
          schema:
            $ref: '#/definitions/DriverChannel'
    put:
      parameters:
      - name: UpdateDriverChannel
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateDriverChannel'
      summary: Update driver channel version
      operationId: updateDriverChannelVersion
      description: Update the version for a driver assign to a channel
      tags:
      - Channels
      security:
      - Bearer:
        - w:channels:*
      responses:
        200:
          description: Driver channel details
          schema:
            $ref: '#/definitions/DriverChannel'
    delete:
      summary: Delete driver channel
      operationId: deleteDriverChannel
      description: Delete a driver channel
      tags:
      - Channels
      security:
      - Bearer:
        - w:channels:*
      responses:
        204:
          description: Driver channel deleted successfully
definitions:
  Link:
    type: object
    properties:
      href:
        type: string
        description: An absolute URL linking to a resource.
        example: https://...
  Links:
    type: object
    properties:
      next:
        $ref: '#/definitions/Link'
      previous:
        $ref: '#/definitions/Link'
  ErrorResponse:
    type: object
    properties:
      requestId:
        type: string
        description: A correlation id used for reference when contacting support.
        example: 7b8514e6-230d-41cc-b3c2-512bca15abf0
      error:
        $ref: '#/definitions/Error'
  Error:
    description: Details about the error.
    type: object
    properties:
      code:
        type: string
        description: Machine-readable error code.
        example: ConstraintViolationError
      message:
        type: string
        description: Human-readable error message.
        example: The request was malformed.
      target:
        type: string
        description: Optional field used to point to a problematic part of the request.
        example: 31192dc9-eb45-4d90-b606-21e9b66d8c2b
      details:
        type: array
        items:
          $ref: '#/definitions/Error'
  Owner:
    description: A typed model which provides information around ownership of a specific
      domain.
    type: object
    properties:
      ownerType:
        type: string
        default: USER
        enum:
        - USER
        - SYSTEM
        - IMPLICIT
        - ACCOUNT
        description: The type of owner that owns this entity. "Account" refers specifically
          to a coterie account ID.
      ownerId:
        type: string
        description: A global identifier for owner.
    required:
    - ownerType
    - ownerId
    example:
      ownerType: USER
      ownerId: 72fd3b54-d243-4bf7-a845-92eb7956b982
  Device:
    type: object
    properties:
      deviceId:
        $ref: '#/definitions/DeviceId'
      name:
        type: string
        description: The name that the device integration (Device Handler or SmartApp)
          defines for the device.
        example: color.light.100x
      label:
        type: string
        description: The name that a user chooses for the device. This defaults to
          the same value as name.
        example: color.light.100x
      manufacturerName:
        type: string
        description: The device manufacturer name.
        example: SmartThings
      presentationId:
        type: string
        description: A non-unique id that is used to help drive UI information.
        example: VD-STV_2018_K
      deviceManufacturerCode:
        type: string
        description: The device manufacturer code.
        example: 010F-0B01-2002
      locationId:
        type: string
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        description: The ID of the location with which the device is associated.
        example: 0c0b935d-0616-4441-a0bf-da7aeec3dc0a
      ownerId:
        type: string
        description: The identifier for the owner of the device instance.
        example: 1c75f712-2c3e-4e51-970c-a42ae7aedbdc
      roomId:
        type: string
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        description: The ID of the room with which the device is associated. If the
          device is not associated with any room, this field will be null.
        example: 0fd2b1ef-1b33-4a54-9153-65aca91e9660
      deviceTypeId:
        type: string
        description: Deprecated please look under "dth".
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        example: Deprecated please look under "dth".
      deviceTypeName:
        type: string
        description: Deprecated please look under "dth".
        example: Deprecated please look under "dth".
      deviceNetworkType:
        type: string
        description: Deprecated please look under "dth".
        example: Deprecated please look under "dth".
      productId:
        type: string
        format: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: The device's product ID. If the device is not associated with
          any product, this field will be null.
        example: 48bea670-2bb3-494f-a402-dbc5a7cf1e06
      brandId:
        type: string
        format: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: The device's brand ID. If the device is not associated with any
          brand, this field will be null.
        example: cb1332ca-8dd6-422f-b2ab-e757d9abf694
      components:
        type: array
        description: The IDs of all components on the device.
        items:
          $ref: '#/definitions/DeviceComponent'
      createTime:
        description: The time when the device was created at.
        type: string
      healthState:
        $ref: '#/definitions/IdLessHealthState'
      parentDeviceId:
        description: The id of the Parent device.
        type: string
      childDevices:
        type: array
        description: Device details for all child devices of the device.
        items:
          $ref: '#/definitions/Device'
      profile:
        $ref: '#/definitions/DeviceProfileReference'
      app:
        description: Device Profile information for the SmartApp. This field will
          be empty if device type is not ENDPOINT_APP.
        $ref: '#/definitions/AppDeviceDetails'
      ble:
        description: Bluetooth device information. This field will be empty if device
          type is not BLE.
        $ref: '#/definitions/BleDeviceDetails'
      bleD2D:
        description: Bluetooth device to device information. This field will be empty
          if device type is not BLE_D2D.
        $ref: '#/definitions/BleD2DDeviceDetails'
      dth:
        description: Device Profile information for DTH. This field will be empty
          if device type is not DTH.
        $ref: '#/definitions/DthDeviceDetails'
      lan:
        $ref: '#/definitions/LanDeviceDetails'
      zigbee:
        $ref: '#/definitions/ZigbeeDeviceDetails'
      zwave:
        $ref: '#/definitions/ZwaveDeviceDetails'
      matter:
        $ref: '#/definitions/MatterDeviceDetails'
      hub:
        $ref: '#/definitions/HubDeviceDetails'
      edgeChild:
        $ref: '#/definitions/EdgeChildDeviceDetails'
      ir:
        type: object
        description: IR device information. This field will be empty if device type
          is not IR.
        $ref: '#/definitions/IrDeviceDetails'
      irOcf:
        type: object
        description: IR_OCF device information. This field will be empty if device
          type is not IR_OCF.
        $ref: '#/definitions/IrDeviceDetails'
      ocf:
        type: object
        description: OCF device information. This field will be empty if device type
          is not OCF.
        $ref: '#/definitions/OcfDeviceDetails'
      viper:
        $ref: '#/definitions/ViperDeviceDetails'
        description: Viper device information. This field will be empty if device
          type is not VIPER.
      group:
        type: object
        $ref: '#/definitions/GroupDeviceDetails'
        description: Group device information. This field will be empty if device
          type is not GROUP.
      virtual:
        $ref: '#/definitions/VirtualDeviceDetails'
        description: Virtual device information. This field will be empty if device
          type is not VIRTUAL.
      mqtt:
        $ref: '#/definitions/MqttDeviceDetails'
        description: MQTT device information. This field will be empty if device type
          is not MQTT.
      type:
        $ref: '#/definitions/DeviceIntegrationType'
      restrictionTier:
        type: integer
        description: Restriction tier of the device, if any.
      allowed:
        type: array
        description: |
          List of client-facing action identifiers that are currently permitted for the user.
          If the value of this property is not null, then any action not included in the list value of the property is currently prohibited for the user.
          If the value of this property is null (or absent), then no permission-related information is being provided.
            <ul>
            <li> w:devices - the user can change device details
            <li> w:devices:locationId - the user can move the device from a location
            <li> w:devices:roomId - the user can move or remove the device from a room
            <li> x:devices - the user can execute commands on the device
            <li> d:devices - the user can uninstall the device
            </ul>
        items:
          type: string
        uniqueItems: true
        enum:
        - w:devices
        - w:devices:locationId
        - w:devices:roomId
        - x:devices
        - d:devices
      indoorMap:
        $ref: '#/definitions/IndoorMap'
      executionContext:
        $ref: '#/definitions/ExecutionContext'
      relationships:
        type: array
        description: |
          Set of relationships to other devices. These devices behave in a coordinated fashion as described by the properties of the relationship.
        items:
          $ref: '#/definitions/DeviceRelationship'
    required:
    - deviceId
    - presentationId
    - manufacturerName
    - type
    - restrictionTier
  IdLessHealthState:
    type: object
    properties:
      state:
        description: Current state of the device
        type: string
        enum:
        - ONLINE
        - OFFLINE
      lastUpdatedDate:
        type: string
        description: Last reported date/time in UTC
        format: date-time
  PagedDevices:
    description: A paginated array of devices.
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/Device'
      _links:
        $ref: '#/definitions/Links'
  DeviceComponentRequest:
    type: object
    properties:
      label:
        type: string
        description: UTF-8 label for the component.
      id:
        type: string
        example: main
        format: ^[-_!.~'()*0-9a-zA-Z]{1,36}$
      capabilities:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: '#/definitions/CapabilityReferenceRequest'
        description: A list of `[ 1..100 ]` capabilities for this component.
      categories:
        type: array
        items:
          $ref: '#/definitions/DeviceCategory'
      restrictions:
        $ref: '#/definitions/Restriction'
      optional:
        type: boolean
        example: false
        default: false
        description: |
          An optional component is available to be enabled for a device, but will not be part of the device record at
          join time unless specified. In other words, if set to `true`, then devices using this profile can support the
          component, but are not required to. If set to `false`, devices using profile must support the component. Note
          that all components, whether optional or not, must have at least one required (i.e. not optional) capability.
    required:
    - id
    - capabilities
    - categories
  DeviceComponent:
    type: object
    properties:
      id:
        type: string
        example: main
        format: ^[-_!.~'()*0-9a-zA-Z]{1,36}$
      label:
        type: string
        description: UTF-8 label for the component.
      capabilities:
        type: array
        items:
          $ref: '#/definitions/DeviceCapabilityReference'
      categories:
        type: array
        description: |
          Defines the categories for the device. There can be up to two: one defined by the manufacturer, the other a user-selected value.
        items:
          $ref: '#/definitions/DeviceCategory'
      restrictions:
        $ref: '#/definitions/Restriction'
      optional:
        type: boolean
        example: false
        default: false
        description: |
          An optional component is available to be enabled for a device, but will not be part of the device record at
          join time unless specified. In other words, if set to `true`, then devices using this profile can support the
          component, but are not required to. If set to `false`, devices using profile must support the component. Note
          that all components, whether optional or not, must have at least one required (i.e. not optional) capability.
    required:
    - id
    - capabilities
    - categories
  DeviceCapabilityReference:
    allOf:
    - $ref: '#/definitions/CapabilityReference'
    - $ref: '#/definitions/DeviceCapabilityStatus'
  DeviceCapabilityStatus:
    type: object
    properties:
      status:
        $ref: '#/definitions/CapabilityStatus'
  DeviceCategory:
    description: A case-sensitive string from the pre-defined list of valid categories
      [/devicecategories](#/operation/listCategories).
    type: object
    properties:
      name:
        example: Light
        type: string
      categoryType:
        type: string
        enum:
        - manufacturer
        - user
        default: manufacturer
    required:
    - name
    - categoryType
  DeviceCommandsRequest:
    type: object
    properties:
      commands:
        description: An array of commands to execute on the device.
        type: array
        items:
          $ref: '#/definitions/DeviceCommand'
    example:
      commands:
      - component: main
        capability: colorTemperature
        command: setColorTemperature
        arguments:
        - '30000'
  DeviceCommand:
    type: object
    properties:
      component:
        type: string
        description: The name of the component on this device, default is 'main'.
          The component must be valid for the device.
        default: main
        format: ^[-_!.~'()*0-9a-zA-Z]{1,36}$
      capability:
        description: Capability that this command relates to. This must be a capability
          of the component.
        type: string
      command:
        description: Name of the command, this must be valid for the capability.
        type: string
      arguments:
        type: array
        items:
          type: object
        description: |
          Arguments of the command.
          All the required arguments defined in the capability's command argument definition must be provided.
          The type of the arguments are dependent on the type of the capability's command argument.
          Please refer to the capabilities definition at https://developer.smartthings.com/docs/devices/capabilities/capabilities-reference
      commandId:
        type: string
        description: The id on the command that triggered this event, if applicable.
          Used for correlation of commands to events.
    required:
    - capability
    - command
    example:
      component: main
      capability: switchLevel
      command: setLevel
      arguments:
      - 80
  DeviceStatus:
    description: The status of a device.
    type: object
    properties:
      components:
        description: A map of componentId to component status.
        type: object
        additionalProperties:
          $ref: '#/definitions/ComponentStatus'
        example:
          main:
            switch:
              switch:
                value: 'on'
            switchLevel:
              level:
                value: 90
      healthState:
        type: object
        properties:
          state:
            description: Current state of the device
            type: string
            enum:
            - ONLINE
            - OFFLINE
          lastUpdatedDate:
            type: string
            description: Last reported date/time in UTC
            format: date-time
  ComponentStatus:
    description: A map of capabilityId to capability status.
    type: object
    additionalProperties:
      $ref: '#/definitions/CapabilityStatus'
    example:
      switch:
        switch:
          value: 'on'
      switchLevel:
        level:
          value: 90
  CapabilityStatus:
    description: A map of attribute name to attribute state.
    type: object
    additionalProperties:
      $ref: '#/definitions/AttributeState'
    example:
      switch:
        value: 'on'
  AttributeState:
    type: object
    properties:
      value:
        type: object
        example: 0
      unit:
        type: string
        example: Â°C
      data:
        type: object
        additionalProperties:
          type: object
        example:
          method: manual
          codeId: 1234
          timeout: 2018-05-09T23:03:31+0000
      timestamp:
        type: string
        description: Will always be 0 timezone offset
        format: date-time
        example: '2017-12-18T22:14:52.714Z'
  DeviceHealthState:
    type: object
    properties:
      deviceId:
        type: string
        description: Id of the device
      state:
        $ref: '#/definitions/HealthState'
      lastUpdatedDate:
        type: string
        description: Last reported date/time in UTC
        format: date-time
    required:
    - deviceId
    - state
    - lastUpdatedDate
  HealthState:
    type: string
    enum:
    - ONLINE
    - OFFLINE
  DeviceEventsRequest:
    type: object
    properties:
      deviceEvents:
        description: An array of attribute state updates.
        type: array
        minItems: 1
        maxItems: 8
        items:
          $ref: '#/definitions/DeviceStateEvent'
  DeviceRelationship:
    type: object
    properties:
      deviceId:
        type: string
        description: The identifier for the related device.
        example: 6f5ea629-4c05-4a90-a244-cc129b0a80c3
      relationshipType:
        $ref: '#/definitions/RelationshipTypeEnum'
      onDelete:
        $ref: '#/definitions/OnDeleteEnum'
      onLocationMove:
        $ref: '#/definitions/OnLocationMoveEnum'
      onOwnershipTransfer:
        $ref: '#/definitions/OnOwnershipTransferEnum'
  RelationshipTypeEnum:
    type: string
    description: |
      Describes the relationship * COMBINATION - Distinct devices that share the same physical case * CHILD - Representation of a child device of this device
    enum:
    - COMBINATION
    - CHILD
  OnDeleteEnum:
    type: string
    description: |
      Describes how the platform will handle the deletion of the device. * CASCADE - The related device defined by the relationships deviceId property will be deleted as well. * NONE - No changes will happen to the related device, except it will no longer be related to this device.
    enum:
    - CASCADE
    - NONE
  OnLocationMoveEnum:
    type: string
    description: |
      Describes how the platform will handle moving the device to a new location. * INCLUDE - The related device defined by the relationships deviceId property will be moved to the new location too.
    enum:
    - INCLUDE
  OnOwnershipTransferEnum:
    type: string
    description: |
      Describes how the platform will handle transferring the device to a new owner. * INCLUDE - The related device defined by the relationships deviceId property will be transferred to the new owner too.
    enum:
    - INCLUDE
  DeviceStateEvent:
    type: object
    properties:
      component:
        type: string
        description: The name of the component on this device, default is 'main'.
      capability:
        type: string
        description: Capability that this event relates to.
      attribute:
        type: string
        description: Name of the capability attribute that this event relates to.
      value:
        type: object
        description: Value associated with the event. The valid value depends on the
          capability.
      unit:
        type: string
        description: Unit of the value field.
      data:
        type: object
        description: Key value pairs about the state of the device. Valid values depend
          on the capability.
        additionalProperties:
          type: object
      commandId:
        type: string
        description: The id on the command that triggered this event, if applicable.
          Used for correlation of commands to events.
    required:
    - value
    example:
      component: main
      capability: switchLevel
      attribute: level
      value: 0
      unit: null
      data: null
  DeviceInstallRequest:
    type: object
    properties:
      label:
        type: string
        description: The label for the device.
        example: Living room light
      locationId:
        type: string
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        description: The ID of the Location with which the device is associated.
        example: 0c0b935d-0616-4441-a0bf-da7aeec3dc0a
      roomId:
        type: string
        description: |
          The ID of the Room with which to associate the Device is associated.
          The Room must be valid for the Location of the Device.
        example: 0fd2b1ef-1b33-4a54-9153-65aca91e9660
      app:
        type: object
        properties:
          profileId:
            type: string
            description: The device profile Id
            example: 6f5ea629-4c05-4a90-a244-cc129b0a80c3
          installedAppId:
            type: string
            description: The ID of the installed application
            format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
            example: 6f5ea629-4c05-4a90-a244-cc129b0a80c3
          externalId:
            type: string
            description: A field to store an ID from a system external to SmartThings.
            maxLength: 64
            example: Th13390
        required:
        - profileId
        - installedAppId
    required:
    - app
    - locationId
  AppDeviceDetails:
    type: object
    properties:
      installedAppId:
        description: The ID of the installed app that integrates this device.
        type: string
        example: 0c0b935d-0616-4441-a0bf-da7aeec3dc0a
        format: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      externalId:
        type: string
        description: A field to store an ID from a system external to SmartThings.
        maxLength: 64
        example: Th13390
      profile:
        $ref: '#/definitions/DeviceProfileReference'
  DthDeviceDetails:
    type: object
    properties:
      completedSetup:
        type: boolean
        description: True if the device setup has been completed so the device is
          ready to use.
      deviceNetworkType:
        $ref: '#/definitions/DeviceNetworkType'
      deviceTypeId:
        type: string
        description: The identifier for the device's DeviceType.
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        example: 7b8514e6-230d-41cc-b3c2-512bca15abf0
      deviceTypeName:
        type: string
        description: The name for the device's DeviceType.
        example: x.com.samsung.da.fridge
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      hubId:
        $ref: '#/definitions/HubId'
      installedGroovyAppId:
        type: string
        description: The ID of the installed groovy application
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        example: 8f5ra619-4c05-4a90-a245-cc129b0a8098
      networkId:
        $ref: '#/definitions/DeviceNetworkId'
      networkSecurityLevel:
        $ref: '#/definitions/DeviceNetworkSecurityLevel'
      fingerprintType:
        $ref: '#/definitions/FingerprintType'
      fingerprintId:
        $ref: '#/definitions/FingerprintId'
    required:
    - deviceTypeId
    - deviceTypeName
    - completedSetup
  IrDeviceDetails:
    type: object
    properties:
      parentDeviceId:
        description: The id of the Parent device.
        type: string
        format: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      profileId:
        type: string
        description: The id of the profile that describes the device components and
          capabilities.
        example: 0c0b875r-0213-6479-a0bf-da7aeec3dc0a
        format: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      ocfDeviceType:
        type: string
        description: The OCF Device Type
        example: oic.d.tv
      irCode:
        type: string
        description: The id of the ircode
        example: 006C
      functionCodes:
        type: object
        description: List of IR function codes
        properties:
          default:
            type: string
        additionalProperties: true
        example:
          statelessPowerToggleButton.powerToggle: power
          statelessAudioMuteButton.muteToggle: mute
          statelessAudioVolumeButton.volumeUp: volume_up
          statelessAudioVolumeButton.volumeDown: volume_down
          statelessChannelButton.channelUp: channel_up
          statelessChannelButton.channelDown: channel_down
          statelessCustomButton.green: green
          statelessCustomButton.right: right
          statelessCustomButton.3: 3
          statelessCustomButton.exit: exit
          statelessCustomButton.playback: playback
      childDevices:
        type: array
        description: list of child devices
        items:
          $ref: '#/definitions/IrDeviceDetails'
      metadata:
        description: |
          Key value pairs stored in the conductor for the device.
          UI Metadata information
        type: object
        additionalProperties: true
  BleDeviceDetails:
    type: object
    additionalProperties: false
  BleD2DDeviceDetails:
    type: object
    properties:
      encryptionKey:
        type: string
        description: Security encryption key.
        example: 96012869B606355A1F843B1E19DC31B1
      cipher:
        type: string
        description: Encryption Algorithm method.
        example: BMO_256-CBS-PKMS1Padding
      gattCipher:
        type: string
        description: Encryption Algorithm method in gatt communication.
        example: BMO_256-CBS-PKMS1Padding
      advertisingId:
        type: string
        description: BLE Advertising Id.
        example: 9C0D4219
      identifier:
        type: string
        description: Unique device identifier.
        example: 88-57-1d-0e-53-ab
      configurationVersion:
        type: string
      configurationUrl:
        type: string
        example: https://apisa.samsungiots.com/v1/miniature/profile/e524ceba-93b9-499d-a90a-24214f7f01cb
      bleDeviceType:
        type: string
        description: Specific device type to identify the type of BLE device
        example: BLE, TAG, DOORLOCK, HEALTH
      metadata:
        type: object
  ViperDeviceDetails:
    type: object
    properties:
      uniqueIdentifier:
        type: string
        example: 1a-74
      manufacturerName:
        type: string
        example: TP-Link
      modelName:
        type: string
        example: HS101
      swVersion:
        type: string
        example: 23.123.231
      hwVersion:
        type: string
        example: v1 US bulb
      endpointAppId:
        type: string
        example: viper_bb238c20-675a-11ed-970f-571777eb58c5
  GroupDeviceDetails:
    type: object
    properties:
      groupName:
        type: string
        example: My Group
      groupType:
        $ref: '#/definitions/DeviceGroupType'
      devices:
        type: array
        items:
          description: An array of devices in the group
          type: object
          properties:
            deviceId:
              description: GUID representing the device
              type: string
              format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
              example: 747d79d3-4685-4852-89b6-e2fc681a590f
            components:
              description: Components to add to the group
              type: array
              items:
                description: components
                type: object
                properties:
                  id:
                    type: string
                    example: main
                additionalProperties: true
          required:
          - deviceId
  IndoorMap:
    type: object
    description: The location of a device on a floorplan map, if any.
    properties:
      coordinates:
        type: array
        description: The coordinates to be used to map the device.
        items:
          type: number
        minItems: 3
        maxItems: 3
      rotation:
        type: array
        description: The rotational data for the device.
        items:
          type: number
        minItems: 3
        maxItems: 3
      visible:
        type: boolean
        description: Whether or not the device is visible on the map.
      data:
        type: object
        additionalProperties: true
        description: Key value pairs to place additional information.
    example:
      coordinates:
      - '1.0'
      - '2.0'
      - '3.0'
      rotation:
      - '0'
      - '0'
      - '0'
      visible: true
      data:
      - extraData1: some data
  ExecutionContext:
    type: string
    description: |
      Where device executes -- locally, in the cloud, or perhaps other in the future. Defaults to CLOUD.
      - 'LOCAL' - executes on the hub
      - 'CLOUD' - executes in the cloud
    enum:
    - LOCAL
    - CLOUD
    default: CLOUD
  VirtualDeviceDetails:
    type: object
    properties:
      name:
        type: string
        description: Name of the device
      hubId:
        $ref: '#/definitions/HubId'
      driverId:
        $ref: '#/definitions/DriverId'
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      commandMappings:
        $ref: '#/definitions/CommandMappings'
  MqttDeviceDetails:
    type: object
    properties:
      hubId:
        type: string
        description: Id of the hub
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      transferCandidate:
        type: boolean
        description: Is this device a transfer candidate
  OcfDeviceDetails:
    type: object
    properties:
      ocfDeviceType:
        type: string
        description: OCF device type
      name:
        type: string
        description: Name of the device
      specVersion:
        type: string
        description: OCF spec version
      verticalDomainSpecVersion:
        type: string
        description: OCF vertical domain spec version
      manufacturerName:
        type: string
        description: OCF manufacturer name
      modelNumber:
        type: string
        description: OCF model number
      platformVersion:
        type: string
        description: OCF platform version
      platformOS:
        type: string
        description: OCF platform OS
      hwVersion:
        type: string
        description: OCF platform H/W version
      firmwareVersion:
        type: string
        description: OCF firmware version
      vendorId:
        type: string
        description: OCF vendor ID
      vendorResourceClientServerVersion:
        type: string
        description: OCF vendor resource client/server version
      locale:
        type: string
        description: Language code
      lastSignupTime:
        type: string
        description: The time when the device is signed up lastly
      transferCandidate:
        type: boolean
        description: Whether or not the device is an ownership transfer candidate
      additionalAuthCodeRequired:
        type: boolean
        description: Whether or not the device requires an additional auth code
      modelCode:
        type: string
        description: Manufacturer model code of the device
  DeviceProfileReference:
    type: object
    properties:
      id:
        type: string
        description: The device profile Id
        example: a7b3c264-2d22-416e-bca1-ca4b59a60aee
  DeviceIntegrationType:
    type: string
    enum:
    - BLE
    - BLE_D2D
    - DTH
    - ENDPOINT_APP
    - GROUP
    - HUB
    - IR
    - IR_OCF
    - LAN
    - MATTER
    - MOBILE
    - MQTT
    - OCF
    - SAFER
    - STPRO
    - PENGYOU
    - SHP
    - VIDEO
    - VIPER
    - VIRTUAL
    - WATCH
    - ZIGBEE
    - ZWAVE
    - EDGE_CHILD
    default: DTH
    description: |
      The type of device integration (may be null).
      If the type is DTH, the device implementation is a groovy Device Handler and the details are in the "dth" field.
      If the type is ENDPOINT_APP, the device implementation is a SmartApp and the details are in the "app" field.
      If the type is IR, the details are in the "ir" field.
      If the type is IR_OCF, the details are in the "irOcf" field.
      If the type is OCF, the details are in the "ocf" field.
      If the type is VIPER, the details are in the "viper" field.
  CreateDeviceEventsResponse:
    type: object
  DeviceCommandsResponse:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/CommandResult'
  CommandResult:
    type: object
    properties:
      id:
        description: A UUID used for tracking the individual command.
        type: string
        format: uuid
      status:
        $ref: '#/definitions/CommandStatus'
  CommandStatus:
    description: |
      `ACCEPTED`: the command is processing but it's outcome is unknown
      `COMPLETED`: the command has successfully completed
      `FAILED`: the command has failed
    type: string
    enum:
    - ACCEPTED
    - COMPLETED
    - FAILED
  DeleteDeviceCommandsResponse:
    type: object
  UpdateDeviceComponent:
    type: object
    properties:
      id:
        type: string
        example: main
      label:
        type: string
        description: The label for the device component.
        example: Living room light switch 2
        minLength: 1
        maxLength: 255
      icon:
        type: string
        description: |
          Identifier allowing the user to pick a custom icon for the device component.
          The icon of the main component represents the device itself
        minLength: 1
        maxLength: 255
      categories:
        type: array
        description: A case-sensitive string from the pre-defined list of valid categories
          [/devicecategories](#/operation/listCategories). Allows the user to redefine
          the category of the device from what the manufacturer set by default.
        items:
          type: string
          example: Light
        minItems: 1
        maxItems: 1
    required:
    - id
    - categories
  UpdateDeviceRequest:
    type: object
    properties:
      label:
        type: string
        description: The label for the device.
        example: Living room light
        minLength: 1
        maxLength: 255
      locationId:
        type: string
        description: |
          The ID of the Location where the Device should be moved to.
          Not all Devices support Location moves.
          Moving between some Locations may be rejected depending on the data region used.
        example: 0c0b935d-0616-4441-a0bf-da7aeec3dc0a
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
      roomId:
        type: string
        description: |
          The ID of the Room with which to associate the Device is associated.
          The Room must be valid for the Location of the Device.
        example: 0fd2b1ef-1b33-4a54-9153-65aca91e9660
        format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
      components:
        type: array
        items:
          $ref: '#/definitions/UpdateDeviceComponent'
      indoorMap:
        $ref: '#/definitions/IndoorMap'
    example:
      label: Living room light
      locationId: 0c0b935d-0616-4441-a0bf-da7aeec3dc0a
      roomId: 0fd2b1ef-1b33-4a54-9153-65aca91e9660
      components:
      - id: main
        label: living room light switch 2
        icon: string
        categories:
        - Light
      indoorMap:
        coordinates:
        - 1.0
        - 2.0
        - 3.0
        rotation:
        - 0.0
        - 0.0
        - 0.0
        visible: true
  DeviceNetworkSecurityLevel:
    type: string
    enum:
    - UNKNOWN
    - ZWAVE_LEGACY_NON_SECURE
    - ZWAVE_S0_LEGACY
    - ZWAVE_S0_FALLBACK
    - ZWAVE_S2_UNAUTHENTICATED
    - ZWAVE_S2_AUTHENTICATED
    - ZWAVE_S2_ACCESS_CONTROL
    - ZWAVE_S2_FAILED
    - ZWAVE_S0_FAILED
    - ZWAVE_S2_DOWNGRADE
    - ZWAVE_S0_DOWNGRADE
    default: UNKNOWN
    description: |
      For hub-connected devices on protocols with multiple security levels, the security level the device was added with.
      Values ZWAVE_S2_FAILED, ZWAVE_S0_FAILED, ZWAVE_S2_DOWNGRADE, and ZWAVE_S0_DOWNGRADE should be treated as failures
      and prompt the user to remove and re-add the device. Other Z-Wave values are success cases.
  ZigbeeOta:
    type: string
    enum:
    - DISABLED
    - ENABLED
    - ENABLED_WITH_LIGHTS
    default: DISABLED
    description: Describes state of Zigbee OTA. ENABLED_WITH_LIGHTS is deprecated
      and should be treated the same as ENABLED.
  LanDeviceDetails:
    type: object
    description: Device Profile information for Lan devices. This field will be empty
      if device type is not LAN.
    properties:
      networkId:
        $ref: '#/definitions/DeviceNetworkId'
      driverId:
        $ref: '#/definitions/DriverId'
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      hubId:
        $ref: '#/definitions/HubId'
      provisioningState:
        $ref: '#/definitions/ProvisioningState'
      fingerprintType:
        $ref: '#/definitions/FingerprintType'
      fingerprintId:
        $ref: '#/definitions/FingerprintId'
  ZigbeeDeviceDetails:
    type: object
    description: Device Profile information for Zigbee devices. This field will be
      empty if device type is not ZIGBEE.
    properties:
      eui:
        $ref: '#/definitions/DeviceEui'
      networkId:
        $ref: '#/definitions/DeviceNetworkId'
      driverId:
        $ref: '#/definitions/DriverId'
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      hubId:
        $ref: '#/definitions/HubId'
      provisioningState:
        $ref: '#/definitions/ProvisioningState'
      fingerprintType:
        $ref: '#/definitions/FingerprintType'
      fingerprintId:
        $ref: '#/definitions/FingerprintId'
  ZwaveDeviceDetails:
    type: object
    description: Device Profile information for Z-Wave devices. This field will be
      empty if device type is not ZWAVE.
    properties:
      networkId:
        $ref: '#/definitions/DeviceNetworkId'
      driverId:
        $ref: '#/definitions/DriverId'
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      hubId:
        $ref: '#/definitions/HubId'
      networkSecurityLevel:
        $ref: '#/definitions/DeviceNetworkSecurityLevel'
      provisioningState:
        $ref: '#/definitions/ProvisioningState'
      manufacturerId:
        $ref: '#/definitions/ZWaveManufacturerId'
      productType:
        $ref: '#/definitions/ZWaveProductType'
      productId:
        $ref: '#/definitions/ZWaveProductId'
      fingerprintType:
        $ref: '#/definitions/FingerprintType'
      fingerprintId:
        $ref: '#/definitions/FingerprintId'
  MatterDeviceDetails:
    type: object
    description: Device Profile information for Matter devices. This field will be
      empty if the device type is not MATTER.
    properties:
      driverId:
        $ref: '#/definitions/DriverId'
      hubId:
        $ref: '#/definitions/HubId'
      provisioningState:
        $ref: '#/definitions/ProvisioningState'
      networkId:
        $ref: '#/definitions/DeviceNetworkId'
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      uniqueId:
        type: string
        description: Vendor-supplied unique identifier. Optional.
      vendorId:
        type: integer
        description: 16-bit vendor id. Optional.
      productId:
        type: integer
        description: 16-bit product id. Optional.
      serialNumber:
        type: string
        description: Device's serial number. Optional.
      listeningType:
        $ref: '#/definitions/MatterListeningType'
      supportedNetworkInterfaces:
        $ref: '#/definitions/MatterNetworkInterfaces'
      version:
        $ref: '#/definitions/MatterVersion'
      endpoints:
        $ref: '#/definitions/MatterEndpoints'
      syncDrivers:
        $ref: '#/definitions/SyncDrivers'
      fingerprintType:
        $ref: '#/definitions/FingerprintType'
      fingerprintId:
        $ref: '#/definitions/FingerprintId'
  EdgeChildDeviceDetails:
    type: object
    description: Device Profile information for Edge Child devices. This field will
      be empty if the device type is not EDGE_CHILD.
    properties:
      driverId:
        $ref: '#/definitions/DriverId'
      hubId:
        $ref: '#/definitions/HubId'
      provisioningState:
        $ref: '#/definitions/ProvisioningState'
      networkId:
        $ref: '#/definitions/DeviceNetworkId'
      executingLocally:
        $ref: '#/definitions/ExecutingLocally'
      parentAssignedChildKey:
        $ref: '#/definitions/ParentAssignedChildKey'
      fingerprintType:
        $ref: '#/definitions/FingerprintType'
      fingerprintId:
        $ref: '#/definitions/FingerprintId'
  ExecutingLocally:
    type: boolean
    description: True if the device is executing locally on the hub
  DeviceEui:
    type: string
    description: The EUID of the Zigbee device
    example: 24FD5B000105DB96
  DeviceNetworkId:
    description: The network-specific identifier of the device on the network
    type: string
  DeviceId:
    type: string
    description: The identifier for the device instance.
    example: 6f5ea629-4c05-4a90-a244-cc129b0a80c3
  DeviceNetworkType:
    type: string
    description: The device network type.
    example: ZIGBEE
  DriverId:
    description: The ID of the Sprocket driver
    type: string
    example: 9314a926-528c-403f-ae56-4b0d059381dd
    format: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  MatterListeningType:
    type: string
    description: Listening type for the device. Optional.
    enum:
    - ALWAYS
    - SLEEPY
  MatterVersion:
    type: object
    description: Hardware and Software version info for matter devices. Optional.
    properties:
      hardware:
        type: integer
        description: 16-bit hardware version. Optional.
        minimum: 0
        maximum: 65535
        example: 771
      hardwareLabel:
        type: string
        description: Label for the hardware version. Optional.
      software:
        type: number
        description: 32-bit software version. Optional.
        minimum: 0
        maximum: 4294967295
        example: 50529027
      softwareLabel:
        type: string
        description: Label for the hardware version. Optional.
  MatterNetworkInterfaces:
    type: array
    description: List of network interfaces. Optional.
    items:
      $ref: '#/definitions/MatterNetworkInterface'
  MatterNetworkInterface:
    type: string
    description: Supported Network Interfaces of the Device
    enum:
    - THREAD
    - WIFI
    - ETHERNET
  MatterEndpoints:
    type: array
    description: Available Matter endpoints
    items:
      $ref: '#/definitions/MatterEndpoint'
  MatterEndpoint:
    type: object
    description: Matter device endpoint
    properties:
      endpointId:
        type: integer
        description: 16-bit identifier for the endpoint
        minimum: 0
        maximum: 65535
        example: 771
      deviceTypes:
        type: array
        description: List of device types for the endpoint
        items:
          $ref: '#/definitions/MatterEndpointDeviceType'
  MatterEndpointDeviceType:
    type: object
    description: Device type for a matter endpoint
    properties:
      deviceTypeId:
        type: number
        description: 32-bit identifier for the device type
        minimum: 0
        maximum: 4294967295
        example: 197379
  SyncDrivers:
    type: boolean
    description: Determines whether or not to sync the child device's driver from
      its parent. Default is true.
    example: true
  HubId:
    type: string
    description: The hub that the device is connected to.
    example: f7239728-edb3-48e9-b588-a27f30b968a0
  ProvisioningState:
    type: string
    description: Provisioning type for a widget device
    enum:
    - PROVISIONED
    - TYPED
    - DRIVER_SWITCH
    - NONFUNCTIONAL
  ParentAssignedChildKey:
    description: The identifier assigned to this edge child device by its parent
    type: string
  CommandMappings:
    type: object
    properties:
      commands:
        type: array
        items:
          minimum: 0
          maximum: 5
          $ref: '#/definitions/CommandMapping'
  CommandMapping:
    description: |-
      A mapping of `commandName` to `attribute.value` that will allow users to support complex commands that would otherwise
      not be determinable simply by the capabililty contract.
    properties:
      capabilityId:
        type: string
        description: The capability ID.
      version:
        description: The capability version number.
        type: integer
      command:
        type: string
        description: The command name to apply the mapping to on the device
      eventValues:
        description: A collection of attribute values, replicator will use these to
          create device events in serial for the specified command.
        type: array
        items:
          $ref: '#/definitions/AttributeValue'
        required:
        - inputType
    required:
    - capabilityId
    - version
    - command
    - attribute
    - eventValues
  AttributeValue:
    description: The description of an attribute value that will be used to populate
      an event.
    type: object
    properties:
      attribute:
        type: string
        description: The attribute that this command will correspond to
      inputType:
        description: How will the attribute be provided? Choose either to provide
          it with a command at runtime or to provide a set value here.
        type: string
        enum:
        - STATIC
        - ARGUMENT
      staticValue:
        type: object
        description: The argument to be used automatically for this command mapping.
          Any simple type is accepted.
  HubDriver:
    type: object
    required:
    - driverId
    properties:
      driverVersion:
        type: string
        description: The version of the driver revision being returned
      driverId:
        type: string
        format: uuid
        description: The identifier of the Sprocket driver
        example: 9314a926-528c-403f-ae56-4b0d059381dd
      channelId:
        type: string
        format: uuid
        description: The identifier of the Sprocket channel
        example: 9314a926-528c-403f-ae56-4b0d059381dd
  AvailabilityCharacteristic:
    type: string
    description: Possible Values for Hub Characteristic "Availability" flags
    enum:
    - Available
    - Unavailable
    - Unsupported
    example: Available
  RepeaterReachabilityCharacteristic:
    type: string
    description: Possible Values for Hub Characteristic "RepeaterReachability" flag
    enum:
    - Unknown
    - Unreachable
    - Reachable
    example: Unreachable
  HubDeviceDetails:
    description: HUB device information. This field will be empty if the device type
      is not HUB.
    required:
    - hubEui
    - firmwareVersion
    - hubData
    - hubDrivers
    - driverId
    type: object
    properties:
      hubEui:
        description: The unique identifier for this manufactured hub.
        type: string
        example: D053A8B4F6D80001
        format: ^[0-9A-F]{16}$
      firmwareVersion:
        type: string
        description: The hub's firmware version
        example: ''
        format: ^[0-9]\.[0-9]\.[0-9]{3}$
      hubDrivers:
        type: array
        description: A list of drivers installed on the hub
        items:
          $ref: '#/definitions/HubDriver'
      hubData:
        type: object
        required:
        - zwaveS2
        - zigbee3
        - hardwareType
        - zigbeeUnsecureRejoin
        properties:
          serialNumber:
            type: string
            description: Device's serial number. Optional.
          zwaveStaticDsk:
            type: string
            example: 21720-31296-41384-03009-58023-25366-38831-43982
            description: Zwave static DSK for the hub.
          zwaveS2:
            type: boolean
            description: Whether zwaveS2 is enabled for this hub.
          hardwareType:
            type: string
            description: The hardwareType for this hub
            example: V3_HUB
          hardwareId:
            type: string
            description: The hub's hardware ID
            example: 00A2
          zigbeeFirmware:
            type: string
            description: The Zigbee firmware version for this hub
            example: 5.4.0
          zigbee3:
            type: boolean
            description: Whether the hub supports zigbee3
          zigbeeOta:
            $ref: '#/definitions/ZigbeeOta'
          otaEnable:
            type: string
            description: Indicates if Zigbee OTA is enabled.
          zigbeeUnsecureRejoin:
            type: boolean
            description: Whether the hub allows zigbee unsecure rejoin
          zigbeeRequiresExternalHardware:
            type: boolean
            description: Whether the hub requires external hardware to support zigbee
              devices
          threadRequiresExternalHardware:
            type: boolean
            description: Whether the hub requires external hardware to support thread
              devices
          failoverAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          primarySupportAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          secondarySupportAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          zigbeeAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          zwaveAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          threadAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          lanAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          matterAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          localVirtualDeviceAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          childDeviceAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          edgeDriversAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          hubReplaceAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          hubLocalApiAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          edgeDriverSupportedEndpointApps:
            $ref: '#/definitions/EdgeDriverSupportedEndpointApps'
          repeaterReachability:
            $ref: '#/definitions/RepeaterReachabilityCharacteristic'
          zigbeeManualFirmwareUpdateSupported:
            type: boolean
            description: True if the hub supports manual firmware updates of Zigbee
              devices when automatic updates are disabled.
          matterRendezvousHedgeSupported:
            $ref: '#/definitions/MatterRendezvousHedgeSupported'
          matterSoftwareComponentVersion:
            $ref: '#/definitions/MatterSoftwareComponentVersion'
          matterDeviceDiagnosticsAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          zigbeeDeviceDiagnosticsAvailability:
            $ref: '#/definitions/AvailabilityCharacteristic'
          hedgeTlsCertificate:
            type: string
            description: A hub's self-signed certificate used for TLS connections
              on hedge endpoints with clients and other hubs
            example: '-----BEGIN CERTIFICATE----- 1A2b3C4d... -----END CERTIFICATE-----'
          hub2hubSupportMatrix:
            type: object
            properties:
              capabilities:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the capability
                      example: HEDGE
                    version:
                      type: integer
                      description: The version of the capability the hub currently
                        supports
                      example: 1
                      minimum: 0
                  required:
                  - name
                  - version
                description: A list of hub2hub capabilities a hub supports
            required:
            - capabilities
          primaryHubDeviceId:
            type: string
            description: The primary hub device id for this hub. Null/Empty if hub
              is not a repeater.
          zigbeeChannel:
            type: string
            description: The Zigbee channel of the hub.
          zigbeePanId:
            type: string
            description: The Personal Area Network (PAN) id of the zigbee network
              the hub is on.
          zigbeeEui:
            type: string
            description: The unique identifier for this manufactured hub.
          zigbeeNodeID:
            type: string
            description: The short address of a node in Zigbee network.
          zwaveNodeID:
            type: string
            description: The address of a single node in the network
          zwaveHomeID:
            type: string
            description: The common identification of all nodes belonging to one logical
              Z-Wave network
          zwaveSucID:
            type: string
          zwaveVersion:
            type: string
          zwaveRegion:
            type: string
            description: The global region this zwave radio is operating in.
          macAddress:
            type: string
            description: MAC address of the hubs network interface.
          localIP:
            type: string
            description: IP address of the hub.
          wifiSsid:
            type: string
            description: WiFi SSID.
          zigbeeRadioFunctional:
            type: boolean
            description: Whether the hub is zigbee radio functional.
          zwaveRadioFunctional:
            type: boolean
            description: Whether the hub is zwave radio functional.
          zigbeeRadioEnabled:
            type: boolean
            description: Whether the hub is enabling zigbee radio.
          zwaveRadioEnabled:
            type: boolean
            description: Whether the hub is enabling zwave radio.
          zigbeeRadioDetected:
            type: boolean
            description: Whether the hub detected zigbee radio.
          zwaveRadioDetected:
            type: boolean
            description: Whether the hub detected zwave radio.
          enrollmentChannel:
            type: string
            description: Enrollment channel.
            enum:
            - PUBLIC
            - BETA
      driverId:
        description: The ID of the driver
        type: string
        example: a5e05a41-0b0a-4d07-a825-b85e9543fc1b
  MatterRendezvousHedgeSupported:
    type: boolean
    description: Value indicating support of matter rendezvous request over hedge
      on the hub
    example: true
  MatterSoftwareComponentVersion:
    type: string
    description: The Matter software component version based on SDK version
    example: 1.2-0
  EdgeDriverSupportedEndpointApps:
    description: The list of Endpoint Apps that provide Edge Driver support that this
      hub can support. This field may be null.
    type: object
    required:
    - apps
    properties:
      apps:
        description: Array of Supported Endpoint App Definitions. The array may be
          empty.
        type: array
        items:
          type: object
          required:
          - appName
          - version
          properties:
            appName:
              description: The Endpoint App Name
              type: string
              example: Sonos
            version:
              description: A string indicating some level of versioning. There is
                no version schema currently enforced.
              type: string
              example: v1
  Restriction:
    description: A typed model which describes a restriction pertaining to a platform
      entity.
    type: object
    properties:
      tier:
        type: integer
        description: The restriction level of an entity to limit actions it can take.
      historyRetentionTTLDays:
        type: integer
        description: The number of days to retain the state before deletion.
      visibleWhenRestricted:
        type: boolean
        default: false
        description: Indicate whether or not the entity is visible when restricted.
    required:
    - tier
  BaseCapabilityReference:
    type: object
    properties:
      id:
        type: string
        example: switch
      version:
        type: integer
        example: 1
      optional:
        type: boolean
        example: false
        default: false
        description: |
          An optional capability is available to be enabled for a device, but will not be part of the device record at
          join time unless specified. In other words, if set to `true`, then devices using this profile can support the
          capability, but are not required to. If set to `false`, devices using profile must support the capability.
    required:
    - id
  CapabilityReference:
    allOf:
    - $ref: '#/definitions/CapabilityReferenceRequest'
    - type: object
      properties:
        ephemeral:
          type: boolean
          example: false
  CapabilityReferenceRequest:
    allOf:
    - $ref: '#/definitions/BaseCapabilityReference'
    - type: object
      properties:
        config:
          $ref: '#/definitions/CapabilityConfiguration'
        restrictions:
          $ref: '#/definitions/Restriction'
  CapabilityConfiguration:
    type: object
    properties:
      values:
        type: array
        items:
          $ref: '#/definitions/CapabilityConfigurationValue'
    required:
    - values
  CapabilityConfigurationValue:
    type: object
    properties:
      key:
        type: string
        description: The path to the preference attribute that is being configured.
        example: thermostatMode.value
      range:
        type: array
        minItems: 2
        maxItems: 2
        description: The range of values supported by the capability attribute. The
          range must be a subset of the one defined on the capability. Either `range`
          OR `enabledValues` must be provided, not both.
        example: '[1, 50]'
        items:
          type: number
          format: double
      enabledValues:
        type: array
        description: The list of enumerated values that are supported for the capability
          attribute. The list of supported value must be a subset of the one defined
          on the capability. Either `range` OR `enabledValues` must be provided, not
          both.
        example: '[ "cooling", "fan only", "heating", "idle" ]'
        items:
          type: string
      step:
        description: The incremental step that increases or decreases for numeric
          values.
        type: number
        format: double
        default: 1.0
    required:
    - key
  DeviceProfileBase:
    type: object
    properties:
      id:
        type: string
        example: a362ddb6-349b-4650-9911-681b51069a57
      name:
        type: string
        example: thermostat1.model1
      metadata:
        $ref: '#/definitions/DeviceProfileMetadata'
      restrictions:
        $ref: '#/definitions/DeviceRestriction'
      presentationId:
        type: string
        example: perfectlife6617.custom-thermostat
    required:
    - id
    - name
  DeviceProfileResponse:
    allOf:
    - $ref: '#/definitions/DeviceProfileBase'
    - $ref: '#/definitions/DeviceProfileMigrationStatus'
    - type: object
      properties:
        status:
          $ref: '#/definitions/DeviceProfileStatus'
        preferences:
          type: array
          items:
            $ref: '#/definitions/PreferenceResponse'
        components:
          type: array
          items:
            $ref: '#/definitions/DeviceComponent'
      required:
      - status
      - components
  PagedDeviceProfiles:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/DeviceProfileResponse'
      _links:
        $ref: '#/definitions/Links'
  DeviceProfileMetadata:
    additionalProperties:
      type: string
      format: ^[-_!.~'() *0-9a-zA-Z\\p{L}]{1,1024}$
    description: Additional information about the device profile, limited to 10 entries.
    example:
      firmWareVersion: 0.2.123
      manufacturerName: SmartThingsCommunity
  DeviceProfileMigrationStatus:
    type: object
    description: Describes the migration status (from v1 -> v2). This profile will
      be available in a backwards compatible fashion regardless.
    properties:
      migrationStatus:
        type: string
        enum:
        - MIGRATED
        - NOT_MIGRATED
        default: NOT_MIGRATED
    required:
    - migrationStatus
  UpdateDeviceProfileRequest:
    type: object
    properties:
      components:
        type: array
        minItems: 1
        description: A list of components for this profile.
        items:
          $ref: '#/definitions/DeviceComponentRequest'
      metadata:
        $ref: '#/definitions/DeviceProfileMetadata'
      preferences:
        type: array
        description: A list of preferences for this profile, whether implicit or explicit.
        items:
          $ref: '#/definitions/PreferenceRequest'
      presentationId:
        type: string
        example: perfectlife6617.custom-thermostat
  CreateDeviceProfileRequest:
    type: object
    properties:
      name:
        type: string
        format: ^(?!\s)[-_!.~'() *0-9a-zA-Z\p{L}]{1,150}(?<!\s)$
        minLength: 1
        maxLength: 150
        example: thermostat1.model1
        description: A name for the device profile.
      components:
        type: array
        minItems: 1
        description: A list of components for this profile. Exactly 1 component ID
          must be `main`.
        items:
          $ref: '#/definitions/DeviceComponentRequest'
      preferences:
        type: array
        description: A list of preferences for this profile, whether implicit or explicit.
        items:
          $ref: '#/definitions/PreferenceRequest'
      metadata:
        $ref: '#/definitions/DeviceProfileMetadata'
      deviceConfig:
        $ref: '#/definitions/embeddedDeviceConfiguration'
      presentationId:
        type: string
        example: perfectlife6617.custom-thermostat
    required:
    - name
    - components
  DeleteDeviceProfileResponse:
    type: object
  DeviceProfileStatus:
    description: |
      The lifecycle status of a device profile.
      'DEVELOPMENT' - Device profile can be modified. The profile is only available to the developer and can only be used with a self-published app.
      'PUBLISHED' - Device profile can be shared with other users, but cannot be modified.
    type: string
    default: DEVELOPMENT
    enum:
    - DEVELOPMENT
    - PUBLISHED
