      weather:
        type: object
        properties:
          lastUpdateTime:
            type: object
            properties:
              value:
                type: string
                description: |
                  Time the data was pull from content provider.
                  ISO 8601 in UTC - YYYY-MM-DDTHH:MM:SS.SSSZ
          vendor:
            type: object
            properties:
              value:
                type: string
                description: Name of the content provider
          version:
            type: object
            properties:
              value:
                type: string
                description: API version number used with the given vendor
          cloudCeiling:
            type: object
            properties:
              value:
                type: number
                description: |
                  (This attribute is not available in Korea and Japan) Base of lowest Mostly Cloudy or Cloudy layer in meters
              unit:
                type: string
                description: m
          cloudCoverPhrase:
            type: object
            properties:
              value:
                type: string
                description: |
                  (This attribute is not available in Korea and Japan)
                  Descriptive sky cover - based on percentage of cloud cover.

                  Range - Clear: coverage < 0.09375; Partly Cloudy: coverage < .59375; Mostly Cloudy: coverage < .75; Cloudy: coverage >= .75
          iconCode:
            type: object
            properties:
              value:
                type: integer
                description: This number is the key to the weather icon lookup.
          conditionState:
            type: object
            properties:
              value:
                type: string
                description: enumerated string of [CLEAR, SNOW, RAIN, CLOUDY, STORM,
                  DUSTY, FOGGY]
          relativeHumidity:
            type: object
            properties:
              value:
                type: integer
                description: |
                  The relative humidity of the air, which is defined as the
                  ratio of the amount of water vapor in the air to the amount
                  of vapor required to bring the air to saturation at a
                  constant temperature. Relative humidity is always expressed
                  as a percentage.

                  Range - 0 to 10
              unit:
                type: string
                description: '%'
          sunriseTimeLocal:
            type: object
            properties:
              value:
                type: string
                description: |
                  This field contains the local time of sunrise. It reflects
                  any local daylight savings conventions in UTC.

                  ISO 8601 in UTC - YYYY-MM-DDTHH:MM:SS.SSSZ
          sunsetTimeLocal:
            type: object
            properties:
              value:
                type: string
                description: |
                  This field contains the local time of sunset. It reflects
                  any local daylight savings conventions.

                  ISO 8601 in UTC - YYYY-MM-DDTHH:MM:SS.SSSZ
          temperature:
            type: object
            properties:
              value:
                type: number
                format: float
                description: |
                  Temperature in Celcius
              unit:
                type: string
                description: C
          temperatureFeelsLike:
            type: object
            properties:
              value:
                type: number
                format: float
                description: |
                  An apparent temperature in Celcius
              unit:
                type: string
                description: C
          dailyOr24hMinTemperature:
            type: object
            properties:
              value:
                type: number
                format: float
                description: |
                  Daily or last 24 hour min temperature in Celcius
              unit:
                type: string
                description: C
          dailyOr24hMaxTemperature:
            type: object
            properties:
              value:
                type: number
                format: float
                description: |
                  Daily or last 24 hour max temperature in Celcius
              unit:
                type: string
                description: C
          uvDescription:
            type: object
            properties:
              value:
                type: string
                description: |
                  (This attribute is not available in Korea and Japan) The UV index description which complements the uvIndex value
              unit:
                type: string
          uvIndex:
            type: object
            properties:
              value:
                type: integer
                description: |
                  The UV index provides indices of the intensity of the solar
                  radiation level and risk of skin damage due to exposure.

                  Range - -2=Not Available, -1=No Report, 0-2=Low, 3-5=Moderate, 6-7=High, 8-10= Very High, 11-16=Extreme
          visibility:
            type: object
            properties:
              value:
                type: number
                description: |
                  The horizontal visibility at the observation point in kilometers
              unit:
                type: string
                description: Km
          weatherDetailUrl:
            type: object
            properties:
              value:
                type: string
                description: |
                  A detail URL from weather vendor with a detail weather information web page
          windDirection:
            type: object
            properties:
              value:
                type: number
                description: |
                  The magnetic wind direction from which the wind blows
                  expressed in degrees.

                  Range - 0<=wind_dire_deg<=350, in 10 degree intervals
              unit:
                type: string
                description: Â°
          windDirectionCardinal:
            type: object
            properties:
              value:
                type: string
                description: |
                  (This attribute is not available in Korea and Japan)
                  This field contains the cardinal direction from which the
                  wind blows in an abbreviated form.

                  Range - N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW, CALM
          windGust:
            type: object
            properties:
              value:
                type: number
                description: |
                  This data field contains information about sudden and
                  temporary variations of the average Wind Speed in kilometers
                  per hour.
              unit:
                type: string
                description: Km/h
          windSpeed:
            type: object
            properties:
              value:
                type: number
                description: |
                  The wind information reported in the hourly current
                  conditions corresponds to a 10-minute average called the
                  sustained wind speed in kilometers per hour
              unit:
                type: string
                description: Km/h
          wxPhraseLong:
            type: object
            properties:
              value:
                type: string
                description: |
                  A text description of observed weather conditions
                  accompanying the iconCode field.

                  Range - 32 character phrase
