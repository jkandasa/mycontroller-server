paths:
  /devices:
    parameters:
    - $ref: '#/parameters/authorization'
    get:
      tags:
      - Devices
      summary: List Devices
      operationId: getDevices
      description: Get a list of devices.
      parameters:
      - name: capability
        in: query
        type: array
        collectionFormat: multi
        required: false
        items:
          type: string
        description: |
          The device capabilities to filter the results by.
          The capabilities are treated as an "and" so all capabilities must be present.
      - name: locationId
        in: query
        type: array
        collectionFormat: multi
        required: false
        items:
          type: string
          format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        description: |
          The device locations to filter the results by.
      - name: deviceId
        in: query
        type: array
        collectionFormat: multi
        required: false
        items:
          type: string
          format: ^(?:([0-9a-fA-F]{32})|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))$
        description: |
          The device IDs to filter the results by.
      - name: capabilitiesMode
        in: query
        type: string
        enum:
        - or
        - and
        default: and
        required: false
        description: |
          Treat all capability filter query params as a logical "or" or "and" with a default of "and".
      - name: includeRestricted
        in: query
        type: boolean
        required: false
        description: |
          Restricted devices are hidden by default. This query parameter will reveal them. Device status will
          not be provided if the token does not have sufficient access level to view the device status even
          if includeStatus parameter is set to true.
      - name: accessLevel
        in: query
        type: integer
        required: false
        description: |
          Only list devices accessible by the given accessLevel.
      - name: includeAllowedActions
        in: query
        type: boolean
        required: false
        description: |
          Include the actions permitted by this token's access for each individual resource.
      - name: includeStatus
        in: query
        type: boolean
        required: false
        description: |
          Include the status of the device's capabilities, if permission is adequate to view them.
          This requires `r:devices` permission.
      - name: includeHealth
        in: query
        type: boolean
        required: false
        description: |
          Include the health status of the device. Requires `r:devices` permission.
      security:
      - Bearer:
        - l:devices
      - Bearer:
        - r:devices:*
      responses:
        200:
          description: A list of devices.
          schema:
            $ref: '#/definitions/PagedDevices'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        400:
          $ref: '#/responses/badRequest'
        429:
          $ref: '#/responses/tooManyRequests'
        default:
          $ref: '#/responses/defaultResponse'
    post:
      tags:
      - Devices
      summary: Install a Device
      operationId: installDevice
      description: |
        Install a Device.

        This call is only available for SmartApp-managed Devices.
        The SmartApp that creates the Device is responsible for handling commands for the Device and
        updating the status of the Device by creating events. Requires installed app principal.
      security:
      - Bearer:
        - i:deviceprofiles
      parameters:
      - name: InstallationRequest
        in: body
        description: Installation Request
        required: true
        schema:
          $ref: '#/definitions/DeviceInstallRequest'
      responses:
        200:
          description: Device Installed.
          schema:
            $ref: '#/definitions/Device'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        400:
          $ref: '#/responses/badRequest'
        422:
          $ref: '#/responses/unprocessableEntity'
        429:
          $ref: '#/responses/tooManyRequests'
        default:
          $ref: '#/responses/defaultResponse'
  /devices/{deviceId}:
    parameters:
    - $ref: '#/parameters/authorization'
    - $ref: '#/parameters/deviceId'
    get:
      tags:
      - Devices
      summary: Get the Description of a Device
      operationId: getDevice
      description: Get a device's given description.
      security:
      - Bearer:
        - r:devices:*
      parameters:
      - name: includeStatus
        in: query
        type: boolean
        required: false
        description: |
          Include the status of the device's capabilities, if permission is adequate to view them.
          This requires `r:devices` permission.
      responses:
        200:
          description: A device
          schema:
            $ref: '#/definitions/Device'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        400:
          $ref: '#/responses/badRequest'
        429:
          $ref: '#/responses/tooManyRequests'
        default:
          $ref: '#/responses/defaultResponse'
    delete:
      tags:
      - Devices
      summary: Delete a Device
      operationId: deleteDevice
      description: |
        Delete a device with a given device ID.

        If the OAuth token used for this call is for a SmartApp that created the device you are attempting to delete, the call implicitly has permission for this API.
      security:
      - Bearer:
        - w:devices:*
      responses:
        200:
          description: Device deleted.
          schema:
            $ref: '#/definitions/DeleteDeviceCommandsResponse'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        400:
          $ref: '#/responses/badRequest'
        429:
          $ref: '#/responses/tooManyRequests'
        default:
          $ref: '#/responses/defaultResponse'
    put:
      tags:
      - Devices
      summary: Update a Device
      operationId: updateDevice
      description: |
        Update the properties of a device.

        If the OAuth token used for this call is for a SmartApp that created the device you are attempting to update, the call implicitly has permission for this API.
      parameters:
      - name: updateDeviceRequest
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateDeviceRequest'
      security:
      - Bearer:
        - w:devices:*
      responses:
        200:
          description: Updated device.
          schema:
            $ref: '#/definitions/Device'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        400:
          $ref: '#/responses/badRequest'
        422:
          $ref: '#/responses/unprocessableEntity'
        429:
          $ref: '#/responses/tooManyRequests'
        default:
          $ref: '#/responses/defaultResponse'
  /devices/{deviceId}/commands:
    parameters:
    - $ref: '#/parameters/authorization'
    - $ref: '#/parameters/deviceId'
    post:
      tags:
      - Devices
      summary: Execute Commands on a Device
      operationId: executeDeviceCommands
      description: Execute a specified command on a device.
      parameters:
      - name: executeCapabilityCommand
        in: body
        required: true
        schema:
          $ref: '#/definitions/DeviceCommandsRequest'
      - name: ordered
        description: |
          This parameter has been deprecated. Functionality is not guaranteed.

          Specifies whether the command should be executed in order or asynchronously.
        type: boolean
        in: query
        required: false
      security:
      - Bearer:
        - x:devices:*
      responses:
        200:
          description: Created commands.
          schema:
            $ref: '#/definitions/DeviceCommandsResponse'
        401:
          $ref: '#/responses/notAuthenticated'
        403:
          $ref: '#/responses/notAuthorized'
        400:
          $ref: '#/responses/badRequest'
        422:
          $ref: '#/responses/unprocessableEntity'
        429:
          $ref: '#/responses/tooManyRequests'
        default:
          $ref: '#/responses/defaultResponse'
