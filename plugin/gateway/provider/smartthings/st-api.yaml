      - name: redirectRequested
        in: query
        required: false
        type: boolean
        default: false
        description: Response of getOauthCallback API depends on this query parameter.
          If true, returns an HTML page with redirect link else returns an HTML page
          with "connection successful/failed" text.
      - name: jsonRspRequested
        in: query
        required: false
        type: boolean
        default: false
        description: |
          This parameter supersedes the redirectRequested parameter if both are provided.
          If true, the API call to `getOauthCallback` requires an "Authorization" header with the same permission(s) as the one used in the call to this API.
          The response from `getOauthCallback` will also be a json object instead of an html page.
