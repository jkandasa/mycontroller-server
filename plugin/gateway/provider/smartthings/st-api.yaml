        enum:
        - object
      properties:
        $ref: '#/definitions/AttributeProperties'
      sensitive:
        type: boolean
        description: Whether or not the attribute contains sensitive data.
      additionalProperties:
        type: boolean
        enum:
        - false
      required:
        type: array
        description: Provide requirement for `value`, `unit`, and `data` fields.
        items:
          type: string
          enum:
          - value
          - unit
          - data
    additionalProperties: false
    required:
    - properties
  AttributeProperties:
    type: object
    description: Data type and value properties used to describe the attribute.
    properties:
      value:
        type: object
        description: Properties that describe the value of an attribute.
        properties:
