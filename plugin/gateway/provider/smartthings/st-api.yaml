  PagedLocation:
    description: A slimmed-down representation of the Location model.
    type: object
    required:
    - locationId
    - name
    - parent
    properties:
      locationId:
        type: string
        format: uuid
        description: The ID of the location.
      name:
        type: string
        description: A name given for the location (eg. Home)
      allowed:
        type: array
        items:
          type: string
          uniqueItems: true
        description: |
          List of client-facing action identifiers that are currently permitted for the user.
          If the value of this property is not null, then any action not included in the list value of the property is currently prohibited for the user.
          If the value of this property is null (or absent), then no permission-related information is being provided.
            <ul>
            <li> w:locations - the user can change the name of the location
            <li> d:locations - the user can delete the location
            <li> w:grants:locationshare - the user can share the location with other users
            <li> w:devices - the user can create devices on the location
            <li> w:locations:geo - the user can edit the geo-coordinates of the location
            <li> r:installedapps - the user can view or list installed apps on the location
            <li> w:installedapps - the user can create installed apps on the location
            <li> r:modes - the user can view or list Modes on the location
            <li> r:rooms - the user can view or list rooms on the location
            <li> w:rooms - the user can create rooms on the location
            <li> r:locations:currentmode - the user can view the current Mode on the location
            <li> w:locations:currentmode - the user can change the current Mode on the location
            <li> r:scenes - the user can view or list scenes on the location
            <li> w:scenes - the user can create scenes on the location
            <li> r:rules - the user can view or list rules on the location
            <li> w:rules - the user can create rules on the location
            <li> r:linkedplaces - the user can view or list linked places on the location
            <li> w:linkedplaces - the user can create linked places on the location
            <li> r:hubmanager - the user can launch the hub manager
            <li> w:hubmanager - the user can edit the hub manager
            <li> r:cameras:clips - the user can view video clips associated with camera devices on the location
            <li> w:cameras:clips - the user can record video clips associated with camera devices on the location
            </ul>
      parent:
        $ref: '#/definitions/LocationParent'
    example:
      locationId: 6b3d1909-1e1c-43ec-adc2-5f941de4fbf9
      name: Home
      parent:
        type: LOCATIONGROUP
        id: 6ecb6c06-7319-49b1-8ebd-f97660efdd06
