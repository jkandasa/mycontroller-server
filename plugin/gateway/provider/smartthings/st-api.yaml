          minimum: 0
          maximum: 20
      unit:
        type: object
        description: The unit which describes the value of the attribute.
        properties:
          type:
            description: Data type for the unit. This is defined by capability schema
              as a `string`.
            type: string
            enum:
            - string
            default: string
          enum:
            type: array
            description: Array of all possible units for the attribute value.
            example:
            - mm
            - in
            items:
              type: string
          default:
            description: The default unit to be used for the attribute value.
            type: string
            example: mm
      data:
        type: object
        description: Special case details may be desired to describe the attribute
          that may not be used the same as a value. Some examples are a timeout or
          a lock code.
        properties:
          type:
            type: string
            description: The data type for the `data` schema is object.
            enum:
            - object
            default: object
          additionalProperties:
            description: Indicates if properties not explicitly defined by the schema
              are allowed. Default is false.
            type: boolean
            default: false
          required:
            type: array
            description: An array of the properties the `data` schema requires.
            items:
              type: string
          properties:
            type: object
            description: Objects can be described in JSON schema for the `data` that
              should be stored on this attribute.
            example:
