  Isa:
    type: object
    properties:
      pageType:
        type: string
        description: Possible values - __requiresLogin__ or __loggedIn__. These two
          values determine what fields are returned in this response. If value is
          "requiresLogin", "oAuthLink" is returned in the response. If value is "loggedIn",
          isaId, partnerName, appName, devices and icons are returned. For both values,
          if the integration is LAN-hybrid, driverId is also returned.
      isaId:
