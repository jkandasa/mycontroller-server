        displayType:
          type: string
          description: To specify the type of UI component to display this action
            or state. The corresponding field must also be included. For example,
            if you specify "switch" here, you must also include the "switch" key and
            its object definition for this action or state.
          enum:
          - slider
          - list
          - dynamicList
          - textField
          - numberField
          - multiArgCommand
        slider:
          $ref: '#/definitions/sliderForAutomationAction'
        list:
          $ref: '#/definitions/listForAutomationAction'
        dynamicList:
          $ref: '#/definitions/dynamicListForAutomationAction'
        textField:
          $ref: '#/definitions/textFieldForAutomationAction'
        numberField:
          $ref: '#/definitions/numberFieldForAutomationAction'
        multiArgCommand:
          $ref: '#/definitions/multiArgCommand'
        emphasis:
          type: boolean
          description: The effect used to emphasize this resource widget. The default
            value is false. If the emphasis value is true and this object has alternatives,
            a list will appear without a label
      required:
      - label
      - displayType
      example:
        label: Dishwasher mode
        displayType: list
        list:
          command: setDishwasherMode
          alternatives:
          - key: auto
            value: Auto mode
          - key: quick
            value: Quick mode
          - key: rinse
            value: Rinse mode
          - key: dry
            value: Dry mode
  automation:
    type: object
    description: |
      In the SmartThings app, you can build custom Automations to automatically trigger actions when certain condition regarding device's state is met.
    properties:
      conditions:
        type: array
        description: To specify the conditions of device state to trigger actions
          in the automation view of SmartThings app.
        items:
          $ref: '#/definitions/automationListItem'
      actions:
        type: array
        description: To specify the actions of device control based on the device
          state in the automation view of SmartThings app.
        items:
          $ref: '#/definitions/actionListItem'
      descriptions:
        $ref: '#/definitions/descriptionsInAutomation'
  group:
    type: string
    description: The group name to which this belongs. Some complex devices can be
      shown grouped in the dashboard card. This is used for grouping states and actions
      in the dashboard.
    default: main
    example: main
  listForDetailView:
    type: object
    description: To specify available values shown in a drop-down UI. User can select
      one of the value among the list items
    properties:
      command:
        type: object
        properties:
          name:
            type: string
            description: name refers to command name and key of the alternatives is
              the argument of the command
          description:
            type: string
            description: Additional description of a command. This description is
              shown in the list.
          alternatives:
            $ref: '#/definitions/alternatives'
          argumentType:
            $ref: '#/definitions/argumentType'
          supportedValues:
            $ref: '#/definitions/supportedValues'
        required:
        - alternatives
      state:
        type: object
        properties:
          value:
            $ref: '#/definitions/value'
          valueType:
            $ref: '#/definitions/valueType'
          alternatives:
            $ref: '#/definitions/alternatives'
        required:
        - value
        - alternatives
    required:
    - command
    example:
      command:
        name: setCleaningMode
        alternatives:
        - key: spot
          value: Spot cleaning mode
        - key: auto
          value: Auto cleaning mode
      state:
        value: cleaningMode.value
        alternatives:
        - key: spot
          value: Spot cleaning mode
        - key: auto
          value: Auto cleaning mode
  listBase:
    type: object
    properties:
      alternatives:
        $ref: '#/definitions/alternatives'
      supportedValues:
        $ref: '#/definitions/supportedValues'
    required:
    - alternatives
    example:
      alternatives:
      - key: cooling
        value: Cooling mode
      - key: heating
        value: Heating mode
      supportedValues: supportedThermostatModes.value
  listForAutomationAction:
    allOf:
    - $ref: '#/definitions/listBase'
    - type: object
      properties:
        command:
          type: string
          description: The name of the command that is called when an item is chosen
            from the list
        argumentType:
          $ref: '#/definitions/argumentType'
      example:
        command: setThermostatMode
  listForAutomationCondition:
    allOf:
    - $ref: '#/definitions/listBase'
    - type: object
      properties:
        value:
          $ref: '#/definitions/value'
        valueType:
          $ref: '#/definitions/valueType'
        multiSelectable:
          type: boolean
          description: To specify whether to allow multiple selection within a list
            or not. Default value is false.
          default: false
      required:
      - value
      example:
        value: thermostatMode.value
        alternatives:
        - key: spot
          value: Spot cleaning mode
          iconUrl: preload://ic_thermostatmode_spot
        - key: auto
          value: Auto cleaning mode
          iconUrl: preload://ic_thermostatmode_auto
        multiSelectable: false
  dynamicListForAutomationCondition:
    type: object
    properties:
      value:
        $ref: '#/definitions/value'
        example: switchMode.value
      valueType:
        type: string
        readOnly: true
        description: The data type of the items in given `supportedValues` array.
          The data type is automatically assigned from the given capability definition.
        example: string
      supportedValues:
        $ref: '#/definitions/supportedValuesForDynamicList'
      alternatives:
        $ref: '#/definitions/alternativesForDynamicList'
      multiSelectable:
        type: boolean
        description: To specify whether to allow multiple selection within a list
          or not. Default value is false.
        default: false
    required:
    - value
    - supportedValues
  dynamicListForAutomationAction:
    type: object
    properties:
      command:
        type: string
        description: To specify a command name with argument(s) and keys of the dynamic
          items specified in `supportedValues` are the arguments of the command. If
          this is omitted then keys at dynamic items specified in `supportedValues`
          are the enumCommands without arguments.
        example: setSwitchMode
      argumentType:
        type: string
        readOnly: true
        description: The data type of the items in given `supportedValues` array.
          The data type is automatically assigned from the given capability definition.
        example: string
      supportedValues:
        $ref: '#/definitions/supportedValuesForDynamicList'
      alternatives:
        $ref: '#/definitions/alternativesForDynamicList'
    required:
    - supportedValues
  supportedValuesForDynamicList:
    type: object
    description: To specify the list of dynamic items provided by the device at runtime
      and make-up option(`valueMap`) if necessary. If the `valueMap` is omitted then
      the supported values specified in `value` itself become both a key and value.
    properties:
      value:
        type: string
        pattern: (^[[a-z]*([A-Z][a-z]*)*){1,36}(\.value)+
      valueMap:
        type: object
        description: To specify the make-up of a map when the provided value is an
          array of maps.
        properties:
          key:
            type: string
            description: Notation which indicates the value of an attribute, command
              or argument.
            pattern: ^({{it.(([a-zA-Z0-9]*){1,36}.*)}})$
          value:
            type: string
            description: Notation which indicates the value to be displayed on UI
            pattern: ^({{it.(([a-zA-Z0-9]*){1,36}.*)}})$
        required:
        - key
        - value
    required:
    - value
    example:
      value: supportedSwitchModes.value
      valueMap:
        key: '{{it.id}}'
        value: '{{it.name}}'
  alternativesForDynamicList:
    type: array
    items:
      $ref: '#/definitions/alternativeItem'
    description: To assign the alternative properties to specific keys among the dynamic
      items provided by `supportedValues`. If the value of the key for the given alternatives
      is not found, the original value from `supportedValues` is used as it is.
  numberField:
    type: object
    description: This display type creates numberfield that the user enters a new
      value and that the new value is passed as an argument to the command
    properties:
      value:
        $ref: '#/definitions/value'
      valueType:
        $ref: '#/definitions/valueType'
      unit:
        $ref: '#/definitions/unit'
      command:
        type: string
      argumentType:
        $ref: '#/definitions/argumentType'
      range:
        $ref: '#/definitions/range'
      supportedValues:
        $ref: '#/definitions/supportedValuesForNumericConstraints'
    required:
    - command
    example:
      value: volume.value
      unit: volume.unit
      command: setVolume
      range:
      - 0
      - 100
      supportedValues: supportedVolumes.value
  numberFieldForAutomationAction:
    type: object
    properties:
      command:
        type: string
      argumentType:
        $ref: '#/definitions/argumentType'
      unit:
        $ref: '#/definitions/unit'
      range:
        $ref: '#/definitions/range'
      alternatives:
        $ref: '#/definitions/alternatives'
      supportedValues:
        $ref: '#/definitions/supportedValuesForNumericConstraints'
      description:
        $ref: '#/definitions/descriptionForAutomationNumberField'
    required:
    - command
    example:
      command: setVolume
      unit: volume.unit
      range:
      - 0
      - 100
      supportedValues: supportedVolumes.value
  numberFieldForAutomationCondition:
    type: object
    properties:
      value:
        $ref: '#/definitions/value'
      valueType:
        $ref: '#/definitions/valueType'
      unit:
        $ref: '#/definitions/unit'
      range:
        $ref: '#/definitions/range'
      alternatives:
        $ref: '#/definitions/alternatives'
      supportedValues:
        $ref: '#/definitions/supportedValuesForNumericConstraints'
      description:
        $ref: '#/definitions/descriptionForAutomationNumberField'
    required:
    - value
    example:
      value: volume.value
      unit: volume.unit
      range:
      - 0
      - 100
      supportedValues: supportedVolumes.value
  playPause:
    type: object
    description: To specify separate commands for play and pause, use the "play" and
      "pause" fields respectively. To specify a single command, use "name" for the
      command and the "play" and "pause" fields for the arguments.
    allOf:
    - $ref: '#/definitions/playPauseCommand'
    - type: object
      properties:
        state:
          type: object
          properties:
            value:
              $ref: '#/definitions/value'
            valueType:
              $ref: '#/definitions/valueType'
            play:
              type: string
              description: The value of "attribute" which indicates playing state.
                When the attribute value equals to this then UI will show playing
                state.
            pause:
              type: string
              description: The value of "attribute" which indicates paused state.
                When the attribute value equals to this then UI will show paused state.
            alternatives:
              $ref: '#/definitions/alternatives'
          required:
          - value
          - play
          - pause
    required:
    - command
    - state
    example:
      command:
        name: setPlaybackState
        play: play
        pause: pause
      state:
        value: playbackState.value
        play: playing
        pause: paused
        alternatives:
        - key: playing
          value: Playing
          type: active
        - key: paused
          value: Paused
          type: inactive
  pushButton:
    type: object
    properties:
      command:
        type: string
      argument:
        type: string
      argumentType:
        $ref: '#/definitions/argumentType'
    required:
    - command
    example:
      command: setButton
      argument: push
  playStop:
    allOf:
    - $ref: '#/definitions/playStopCommand'
    - type: object
      description: To specify separate commands for play and stop, use the "play"
        and "stop" fields respectively. To specify a single command, use "name" for
        the command and the " play" and "stop" fields for the arguments.
      properties:
        state:
          type: object
          properties:
            value:
              $ref: '#/definitions/value'
            play:
              type: string
              description: The value of "attribute" which indicates playing state.
                When the attribute value equals to this then UI will show playing
                state.
            stop:
              type: string
              description: The value of "attribute" which indicates stopped state.
                When the attribute value equals to this then UI will show stopped
                state.
            alternatives:
              $ref: '#/definitions/alternatives'
            valueType:
              $ref: '#/definitions/valueType'
          required:
          - value
          - play
          - stop
      required:
      - state
      - command
      example:
        state:
          value: playbackState.value
          play: playing
          stop: stopped
          alternatives:
          - key: playing
            value: Playing
            type: active
          - key: stopped
            value: Stopped
            type: inactive
  sliderType:
    allOf:
    - $ref: '#/definitions/sliderBase'
    - type: object
      properties:
        alternatives:
          $ref: '#/definitions/alternatives'
        command:
          type: string
          description: The command which will send the value of the slider as an argument
          example: setVolume
        argumentType:
          $ref: '#/definitions/argumentType'
        value:
          $ref: '#/definitions/value'
        valueType:
          $ref: '#/definitions/valueType'
      example:
        command: setVolume
        value: volume.value
  sliderCommandRequired:
    allOf:
    - $ref: '#/definitions/sliderType'
    - type: object
      properties:
        command:
          type: string
          description: The command which will send the value of the slider as an argument
          example: setVolume
      required:
      - command
  sliderBase:
    type: object
    description: To display slider display type, at least one of the command and value
      must be specified.
    properties:
      range:
        $ref: '#/definitions/range'
      step:
        $ref: '#/definitions/step'
      unit:
        $ref: '#/definitions/unit'
      supportedValues:
        $ref: '#/definitions/supportedValuesForNumericConstraints'
    required:
    - range
    example:
      range:
      - 0
      - 100
      step: 0.5
      unit: volume.unit
      supportedValues: supportedVolumes.value
  sliderForAutomationAction:
    allOf:
    - $ref: '#/definitions/sliderBase'
    - type: object
      properties:
        alternatives:
          $ref: '#/definitions/alternatives'
        command:
          type: string
        argumentType:
          $ref: '#/definitions/argumentType'
      required:
      - command
      example:
        command: setTemperature
  sliderForAutomationCondition:
    allOf:
    - $ref: '#/definitions/sliderBase'
    - type: object
      properties:
        alternatives:
          $ref: '#/definitions/alternatives'
        value:
          $ref: '#/definitions/value'
        valueType:
          $ref: '#/definitions/valueType'
      required:
      - value
      example:
        value: volume.value
  enumSliderForAutomationCondition:
    type: object
    description: This display type creates slider composed with enumeration that the
      user can set an automation to compare between enumeration and device's status.
      An alternatives array should be `ascending` order.
    properties:
      alternatives:
        $ref: '#/definitions/alternatives'
      value:
        $ref: '#/definitions/value'
      supportedOperators:
        type: array
        items:
          type: object
          properties:
            operator:
              type: string
              description: The operator to be supported by this display type.
              enum:
              - EQUALS
              - GREATER_THAN_OR_EQUALS
              - LESS_THAN_OR_EQUALS
            label:
              type: string
              description: The alternative string of given operator.
          required:
          - operator
          - label
    required:
    - value
    - alternatives
    example:
      value: dustHealthConcern.value
      alternatives:
      - key: hazardous
        value: Hazardous
      - key: veryUnhealthy
        value: Very Unhealthy
      - key: unhealthy
        value: Unhealthy
      - key: moderate
        value: Moderate
      - key: good
        value: Good
      supportedOperators:
      - operator: EQUALS
        label: Equals to
      - operator: GREATER_THAN_OR_EQUALS
        label: Greater than or equals to
  standbyPowerSwitch:
    allOf:
    - $ref: '#/definitions/switchCommand'
    - $ref: '#/definitions/switchState'
    - type: object
      description: A button switch in the UI. Similar to the `toggleSwitch` displayType
        except for the `off` state is replaced by `standby`.
      example:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  stepper:
    allOf:
    - $ref: '#/definitions/stepperWithoutValue'
    - type: object
      properties:
        value:
          $ref: '#/definitions/value'
        valueType:
          $ref: '#/definitions/valueType'
      example:
        value: volume.value
  switch:
    allOf:
    - $ref: '#/definitions/switchCommand'
    - $ref: '#/definitions/switchState'
    - type: object
      example:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  textField:
    type: object
    description: This display type creates textfield that the user enters a new value
      and that the new value is passed as an argument to the command
    properties:
      command:
        type: string
      argumentType:
        $ref: '#/definitions/argumentType'
      value:
        $ref: '#/definitions/value'
      valueType:
        $ref: '#/definitions/valueType'
      range:
        $ref: '#/definitions/range'
    required:
    - command
    example:
      command: sendNotification
      value: notification.value
  textFieldForAutomationAction:
    type: object
    properties:
      command:
        type: string
      argumentType:
        $ref: '#/definitions/argumentType'
      range:
        $ref: '#/definitions/range'
    required:
    - command
    example:
      command: sendNotification
      range:
      - 0
      - 20
  textFieldForAutomationCondition:
    type: object
    properties:
      value:
        $ref: '#/definitions/value'
      valueType:
        $ref: '#/definitions/valueType'
      range:
        $ref: '#/definitions/range'
    required:
    - value
    example:
      value: notification.value
  toggleSwitch:
    allOf:
    - $ref: '#/definitions/switchCommand'
    - $ref: '#/definitions/switchState'
    - type: object
      description: A button style switch element for the UI.
      example:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  multiArgCommand:
    type: object
    description: To specify multiple arguments command and displayType of each argument.
    properties:
      command:
        type: string
        description: The name of a command that is executed with multiple arguments.
        example: playTrack
      arguments:
        type: array
        items:
          type: object
          properties:
            label:
              type: string
              example: Audio volume
            displayType:
              type: string
              description: Specify the type of UI component to use to display this
                action or state. The corresponding field must also be included. For
                example, if you specify "list" here, you must also include the "list"
                key and its object definition for this action or state.
              enum:
              - slider
              - list
              - textField
              - numberField
            slider:
              $ref: '#/definitions/sliderForArgument'
            list:
              $ref: '#/definitions/listForArgument'
            textField:
              $ref: '#/definitions/textFieldForArgument'
            numberField:
              $ref: '#/definitions/numberFieldForArgument'
          required:
          - label
          - displayType
      supportedValues:
        type: string
        description: The attribute name specified in supportedValues is an array that
          has arguments supported at runtime.
        pattern: (^[[a-z]*([A-Z][a-z]*)*){1,36}(\.value)+
        example: supportedArguments.value
    required:
    - command
    - arguments
  sliderForArgument:
    allOf:
    - $ref: '#/definitions/sliderBase'
    - type: object
      properties:
        name:
          $ref: '#/definitions/argumentName'
        argumentType:
          $ref: '#/definitions/argumentType'
        alternatives:
          $ref: '#/definitions/alternatives'
      example:
        name: level
      required:
      - name
  listForArgument:
    allOf:
    - $ref: '#/definitions/listBase'
    - type: object
      properties:
        name:
          $ref: '#/definitions/argumentName'
        argumentType:
          $ref: '#/definitions/argumentType'
      example:
        name: mode
      required:
      - name
  textFieldForArgument:
    type: object
    properties:
      name:
        $ref: '#/definitions/argumentName'
      argumentType:
        $ref: '#/definitions/argumentType'
      range:
        $ref: '#/definitions/range'
    required:
    - name
    example:
      name: uri
      range:
      - 5
      - 50
  numberFieldForArgument:
    type: object
    properties:
      name:
        $ref: '#/definitions/argumentName'
      unit:
        $ref: '#/definitions/unit'
      argumentType:
        $ref: '#/definitions/argumentType'
      range:
        $ref: '#/definitions/range'
      supportedValues:
        $ref: '#/definitions/supportedValuesForNumericConstraints'
    required:
    - name
    example:
      name: level
      range:
      - 0
      - 10
  argumentName:
    type: string
    description: The name of a command argument. If the argument's type is an object,
      its sub-properties can be defined using dot notation (e.g. `argumentName.propertyName`).
    example: argumentName
  statesArrayItem:
    allOf:
    - $ref: '#/definitions/stateItem'
    - $ref: '#/definitions/capabilityKey'
    - type: object
      required:
      - component
      properties:
        component:
          $ref: '#/definitions/component'
        visibleCondition:
          $ref: '#/definitions/visibleConditionForDashboardState'
        composite:
          $ref: '#/definitions/composite'
        group:
          $ref: '#/definitions/group'
        formatInfo:
          $ref: '#/definitions/formatInfo'
        transient:
          type: boolean
          description: To specify whether the status to be displayed is transient
            or not
          default: false
      example:
        component: main
        visibleCondition:
          component: main
          capability: switch
          version: 1
          value: switch.value
          operator: EQUALS
          operand: 'on'
        composite: false
        transient: false
        group: main
  actionsArrayItem:
    allOf:
    - $ref: '#/definitions/actionItem'
    - $ref: '#/definitions/capabilityKey'
    - type: object
      properties:
        component:
          $ref: '#/definitions/component'
        visibleCondition:
          $ref: '#/definitions/visibleCondition'
        group:
          $ref: '#/definitions/group'
      example:
        component: main
        visibleCondition:
          component: main
          capability: switch
          version: 1
          value: switch.value
          operator: EQUALS
          operand: 'on'
        group: main
  detailViewListItem:
    allOf:
    - $ref: '#/definitions/detailViewItem'
    - type: object
      properties:
        component:
          $ref: '#/definitions/component'
        visibleCondition:
          $ref: '#/definitions/visibleConditionForDetailView'
      example:
        component: main
        capability: thermostatCoolingSetpoint
        version: 1
        label: Cooling temperature
        displayType: slider
        slider:
          range:
          - 0.0
          - 40.0
          value: coolingSetpoint.value
          unit: coolingSetpoint.unit
          command: setCoolingSetpoint
        visibleCondition:
          component: main
          capability: switch
          version: 1
          value: switch.value
          operator: EQUALS
          operand: 'on'
          hideOnUnmatch: false
  automationListItem:
    allOf:
    - $ref: '#/definitions/automationCondition'
    - type: object
      properties:
        exclusion:
          type: array
          description: To exclude specified automation in `exclude` when this item
            is selected by the user.
          items:
            $ref: '#/definitions/excludedConditionItem'
        component:
          $ref: '#/definitions/component'
        visibleCondition:
          $ref: '#/definitions/visibleCondition'
      example:
        component: main
        visibleCondition:
          component: main
          capability: switch
          version: 1
          value: switch.value
          operator: EQUALS
          operand: 'on'
  actionListItem:
    allOf:
    - $ref: '#/definitions/automationAction'
    - type: object
      properties:
        component:
          $ref: '#/definitions/component'
        visibleCondition:
          $ref: '#/definitions/visibleCondition'
        exclusion:
          type: array
          description: To exclude specified automation in `exclude` when this item
            is selected by the user.
          items:
            $ref: '#/definitions/excludedActionItem'
      example:
        component: main
        visibleCondition:
          component: main
          capability: switch
          version: 1
          value: switch.value
          operator: EQUALS
          operand: 'on'
  toggleSwitchForDashboard:
    allOf:
    - $ref: '#/definitions/switchForDashboard'
    - type: object
      description: A button style switch element for the UI.
      example:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  switchCommand:
    type: object
    properties:
      command:
        type: object
        description: To specify separate commands with no arguments for on and off,
          use the "on" and "off" fields respectively. To specify a single command,
          use "name" for the command and the "on" and "off" fields for the arguments.
        properties:
          name:
            type: string
          'on':
            type: string
          'off':
            type: string
          argumentType:
            $ref: '#/definitions/argumentType'
        required:
        - 'on'
        - 'off'
    required:
    - command
    example:
      command:
        name: setLock
        'on': locked
        'off': unlocked
  switchState:
    type: object
    properties:
      state:
        type: object
        description: To describe "on" and "off" state of a switch
        properties:
          value:
            $ref: '#/definitions/value'
          valueType:
            $ref: '#/definitions/valueType'
          'on':
            type: string
            description: The attribute value that corresponds to the `on` state.
          'off':
            type: string
            description: The attribute value that corresponds to the `off` state.
          label:
            $ref: '#/definitions/formattedLabel'
          alternatives:
            $ref: '#/definitions/alternatives'
        required:
        - value
        - 'on'
        - 'off'
    example:
      state:
        value: lock.value
        'on': locked
        'off': unlocked
        label: 'Lock: {{lock.value}}'
        alternatives:
        - key: locked
          value: Locked
          type: inactive
        - key: unlocked
          value: Unlocked
          type: active
  switchStateForDashboard:
    type: object
    properties:
      state:
        type: object
        description: To describe "on" and "off" state of a switch
        properties:
          value:
            $ref: '#/definitions/value'
          'on':
            type: string
          'off':
            type: string
          valueType:
            $ref: '#/definitions/valueType'
          alternatives:
            $ref: '#/definitions/alternatives'
        required:
        - 'on'
        - 'off'
    example:
      state:
        value: lock.value
        'on': locked
        'off': unlocked
  switchForDashboard:
    allOf:
    - $ref: '#/definitions/switchCommand'
    - $ref: '#/definitions/switchStateForDashboard'
    - type: object
      example:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  standbyPowerSwitchForDashboard:
    allOf:
    - $ref: '#/definitions/switchCommand'
    - $ref: '#/definitions/switchState'
    - type: object
      description: A button switch in the UI. Similar to the `toggleSwitch` displayType
        except for the `off` state is replaced by `standby`.
      example:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  statelessPowerToggleForDashboard:
    type: object
    description: This switch triggers power toggle action without showing any status.
    properties:
      command:
        type: string
      argument:
        type: string
      argumentType:
        $ref: '#/definitions/argumentType'
    required:
    - command
    example:
      command: setButton
      argument: push
  playPauseCommand:
    type: object
    description: Display type for a play/pause button.
    properties:
      command:
        type: object
        description: To specify separate commands with no arguments for on and off,
          use the "play" and "pause" fields respectively. To specify a single command,
          use "name" for the command and the "play" and "pause" fields for the arguments.
        properties:
          name:
            type: string
          play:
            type: string
          pause:
            type: string
          argumentType:
            $ref: '#/definitions/argumentType'
        required:
        - play
        - pause
    required:
    - command
    example:
      command:
        name: setPlaybackState
        play: playing
        pause: paused
  playStopCommand:
    type: object
    description: Display type for a play/stop button.
    properties:
      command:
        type: object
        description: To specify separate commands with no arguments for on and off,
          use the "play" and "stop" fields respectively. To specify a single command,
          use "name" for the command and the "play" and "stop" fields for the arguments.
        properties:
          name:
            type: string
          play:
            type: string
          stop:
            type: string
          argumentType:
            $ref: '#/definitions/argumentType'
        required:
        - play
        - stop
    required:
    - command
    example:
      command:
        name: setPlaybackState
        play: play
        stop: pause
  textButton:
    type: object
    description: To specify available values shown in buttons with text label.
    properties:
      command:
        type: string
        description: To specify command name with argument(s) and key of the buttons
          is the argument of the command. If this is omitted then keys at `buttons`
          array are the enumCommands without arguments.
        example: setThermostatMode
      value:
        $ref: '#/definitions/value'
      buttons:
        type: array
        items:
          type: object
          required:
          - key
          - label
          properties:
            key:
              type: string
              description: A command name or an argument name of a command to be mapped
                with this button.
              example: cooling
            label:
              type: string
              description: The alternative string to be displayed when the `key` is
                evaluated.
              example: Cooling
            state:
              type: string
              description: To focus this button according to the current status of
                given attribute which is mapped with this button.
              example: Cooling
        minItems: 2
      supportedValues:
        $ref: '#/definitions/supportedValues'
    required:
    - buttons
  value:
    type: string
    description: Notation which indicates the value of an attribute
    pattern: (^[[a-z]*([A-Z][a-z]*)*){1,36}(\.value)+
    example: switch.value
  unit:
    description: Notation which indicates the unit
    type: string
    pattern: (^[[a-z]*([A-Z][a-z]*)*){1,36}(\.unit)+
    example: temperature.unit
  excludedConditionItem:
    type: object
    properties:
      value:
        type: object
        description: To express that a specific value is selected
        example: HDMI
      exclude:
        type: array
        items:
          type: object
          properties:
            component:
              type: string
              example: main
            capability:
              type: string
              example: pictureMode
            version:
              type: integer
              default: 1
              example: 1
            attributes:
              $ref: '#/definitions/excludeItemsAttributes'
          required:
          - capability
    required:
    - exclude
  excludedActionItem:
    type: object
    properties:
      value:
        type: object
        description: To express that a specific value is selected
        example: 'off'
      exclude:
        type: array
        items:
          type: object
          properties:
            component:
              type: string
              description: To specify target component to exclude, if it's omitted
                then all components with this capability will be excluded
              example: main
            capability:
              type: string
              example: pictureMode
            version:
              type: integer
              default: 1
              example: 1
            commands:
              $ref: '#/definitions/excludeItemsCommands'
          required:
          - capability
    required:
    - exclude
  excludedConditionItemId:
    allOf:
    - type: object
      properties:
        id:
          type: integer
          description: The index of the array in the given capability to which this
            exclusion object will be inserted
    - $ref: '#/definitions/excludedConditionItem'
  excludedActionItemId:
    allOf:
    - type: object
      properties:
        id:
          type: integer
          description: The index of the array in the given capability to which this
            exclusion object will be inserted
    - $ref: '#/definitions/excludedActionItem'
  excludeItemsCommands:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        excludedValues:
          type: array
          description: To exclude only some values of the attribute
          items:
            type: string
      required:
      - name
  excludeItemsAttributes:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: Attribute name to be excluded
        excludedValues:
          type: array
          description: To exclude only some values of the attribute
          items:
            type: string
      required:
      - name
  valueType:
    type: string
    readOnly: true
    description: The data type of the `value`. The data type is automatically assigned
      from the given capability definition.
    example: double
  argumentType:
    type: string
    readOnly: true
    description: The data type of the `argument`. The data type is automatically assigned
      from the given capability definition.
    example: double
  patchItem:
    type: object
    properties:
      op:
        type: string
        description: Operation objects MUST have exactly one "op" member, whose value
          indicates the operation to perform
        example: replace
        enum:
        - add
        - replace
        - remove
      path:
        type: string
        description: path specifies a string format for identifying a specific value
          within a JSON document. It is used by all operations in patch to specify
          the part of the document to operate on.
        example: /0/alternatives/1/value
      value:
        type: object
        example: Focus mode
    required:
    - op
    - path
  deviceConfigEntryBase:
    type: object
    properties:
      component:
        type: string
        example: main
      capability:
        type: string
        example: thermostatMode
      version:
        $ref: '#/definitions/version'
    required:
    - component
    - capability
  capabilityValueForDashboardState:
    type: object
    properties:
      label:
        type: string
      alternatives:
        $ref: '#/definitions/alternatives'
  deviceConfigEntryForDashboardState:
    allOf:
    - $ref: '#/definitions/deviceConfigEntryBase'
    - type: object
      properties:
        idx:
          $ref: '#/definitions/idx'
        group:
          $ref: '#/definitions/group'
        values:
          description: A list of valid values for the command argument or attribute
            that can override those defined by the alternatives provided in the capability
            presentation.
          type: array
          items:
            $ref: '#/definitions/capabilityValueForDashboardState'
          maxItems: 1
        composite:
          $ref: '#/definitions/composite'
        formatInfo:
          $ref: '#/definitions/formatInfo'
        visibleCondition:
          $ref: '#/definitions/visibleConditionForDashboardState'
  deviceConfigEntryForDashboardAction:
    allOf:
    - $ref: '#/definitions/deviceConfigEntryBase'
    - type: object
      properties:
        idx:
          $ref: '#/definitions/idx'
        group:
          $ref: '#/definitions/group'
        inline:
          allOf:
          - type: object
            description: To override the referenced capability presentation inline.
              It corresponds to the schema of the dashboard.actions item of capability
              presentation.
          - $ref: '#/definitions/actionItem'
        visibleCondition:
          $ref: '#/definitions/visibleCondition'
  deviceConfigEntryForDetailView:
    allOf:
    - $ref: '#/definitions/deviceConfigEntry'
    - type: object
      properties:
        visibleCondition:
          $ref: '#/definitions/visibleConditionForDetailView'
  idx:
    type: integer
    description: An index among the multiple items of dashboard provided in the capability
      presentation.
    default: 0
  composite:
    description: To specify composite use of different state items. If composite is
      true, multiple states items in the same group are combined to a label.
    type: boolean
    default: false
  formatInfo:
    type: array
    items:
      type: object
      properties:
        key:
          $ref: '#/definitions/value'
        type:
          type: string
          description: To specify the type of format to display this attribute value.
            The corresponding field must also be included. For example, if you specify
            "remainingTime" here, you must also include the "remainingTime" key and
            its object definition for formatInfo.
          example: remainingTime
          enum:
          - remainingTime
          - time
        remainingTime:
          type: object
          properties:
            timeFormat:
              $ref: '#/definitions/timeFormat'
            frequency:
              type: integer
              description: Specify the frequency time(second) so UI client can know
                how often to update the remaing time.
              default: 60
              example: 60
          required:
          - timeFormat
        time:
          type: object
          properties:
            timeFormat:
              $ref: '#/definitions/timeFormat'
          required:
          - timeFormat
      required:
      - key
      - type
  timeFormat:
    type: string
    pattern: (MM/dd ){0,1}(HH:|hh:){0,1}mm(:ss){0,1}
    example: HH:mm:ss
  descriptionsInAutomation:
    type: object
    description: To specify informative descriptions for condition or action in automation
      view
    properties:
      conditions:
        type: array
        items:
          $ref: '#/definitions/descriptionItem'
      actions:
        type: array
        items:
          $ref: '#/definitions/descriptionItem'
  descriptionItem:
    type: object
    properties:
      operator:
        $ref: '#/definitions/operatorForVisibleConditions'
      label:
        type: string
        example: Sample description
      visibleConditions:
        type: array
        items:
          $ref: '#/definitions/visibleCondition'
    required:
    - label
  InstalledDriver:
    type: object
    properties:
      driverId:
        type: string
        description: Unique Identifier of the driver
        example: 6d7bf35a-bb57-4b1f-945a-63ff72bfbef3
      name:
        type: string
        description: User friendly Identifier for Driver
        example: Caleb's Fiendly Driver
      description:
        type: string
        description: Description of Driver
        example: One friendly driver alright
      version:
        type: string
        description: version of the driver currently in use
      channelId:
        type: string
        description: identifier for channel this driver is installed from
      developer:
        type: string
        description: developer of the driver
      vendorSupportInformation:
        type: string
        description: information on how to reach vendor
        example: You can find us at JustAFriendlyDriver.com
      permissions:
        type: object
        additionalProperties:
          type: object
        description: |
          map of permissions and attributes used by the driver.
          In format of {"permissions":{"perm1":{...}, "perm2"{...}}}
        example:
          lan: {
            }
          lan_internet:
            allowed_hosts:
            - smartthings.com
            - samsung.com
      isWWST:
        type: boolean
        description: Flag to denote that this driver is part of a works with SmartThings
          channel
    required:
    - driverId
    - name
    - version
  InstallDriverRequest:
    type: object
    properties:
      channelId:
        type: string
        description: Unique Identifier of the channel the driver is being installed
          from
        example: 6d7bf35a-bb57-4b1f-945a-63ff72bfbef3
  EdgeDeviceUpdateRequest:
    type: object
    properties:
      driverId:
        type: string
        description: Unique Identifier of the driver
        example: 6d7bf35a-bb57-4b1f-945a-63ff72bfbef3
      deviceIntegrationProfileKey:
        $ref: '#/definitions/DeviceIntegrationProfileKey'
      provisioningState:
        $ref: '#/definitions/ProvisioningState'
    required:
    - driverId
  InstalledDrivers:
    type: array
    description: List of installed Hub Device drivers
    items:
      $ref: '#/definitions/InstalledDriver'
  HubDriverChannels:
    type: array
    description: List of driver channels
    items:
      $ref: '#/definitions/HubDriverChannel'
  HubDriverChannel:
    type: object
    properties:
      channelId:
        type: string
        description: Unique Identifier of the channel
        example: 6d7bf35a-bb57-4b1f-945a-63ff72bfbef3
      name:
        type: string
        description: User friendly Identifier for Channel
        example: Caleb's Fiendly Drivers
      description:
        type: string
        description: Description of Channel and Contained Drivers
        example: Just some friendly Drivers Here
      createdDate:
        type: string
        description: ISO-8601 timestamp of creation of channel
      lastModifiedDate:
        type: string
        description: ISO-8601 timestamp of last modification of channel
      subscriptionUrl:
        type: string
        description: Url to web interface to modifiy channel subscriptions
      isWWST:
        type: boolean
        description: Flag to denote that it works with SmartThings channel
    required:
    - channelId
    - name
  Driver:
    allOf:
    - $ref: '#/definitions/PagedDriver'
    - type: object
      properties:
        fingerprints:
          type: array
          items:
            $ref: '#/definitions/DriverFingerprint'
          minItems: 0
          maxItems: 100
        permissions:
          $ref: '#/definitions/DriverPermissions'
  PagedDriver:
    type: object
    properties:
      driverId:
        $ref: '#/definitions/DriverId'
      name:
        $ref: '#/definitions/DriverName'
      packageKey:
        $ref: '#/definitions/PackageKey'
      deviceIntegrationProfiles:
        type: array
        items:
          $ref: '#/definitions/DeviceIntegrationProfileKey'
        minItems: 0
        maxItems: 100
      permissions:
        $ref: '#/definitions/DriverPermissions'
      version:
        $ref: '#/definitions/DriverVersion'
    required:
    - driverId
    - name
    - packageKey
  DriverVersion:
    type: string
    description: The version of the driver revision being returned
  DriverPermissions:
    type: array
    items:
      $ref: '#/definitions/DriverPermission'
    minItems: 0
    maxItems: 100
  DriverPermission:
    type: object
    properties:
      name:
        type: string
        description: Name of the permission
      attributes:
        $ref: '#/definitions/PermissionAttributes'
    required:
    - attributes
    - name
  PermissionAttributes:
    description: Additional properties on a driver permission
    type: object
    additionalProperties:
      type: object
      description: |
        map of permissions and attributes used by the driver.
        In format of {"permissions":{"perm1":{...}, "perm2"{...}}}
      example:
        lan: {
          }
        lan_internet:
          allowed_hosts:
          - smartthings.com
          - samsung.com
  DeviceIntegrationProfileKey:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Unique identifier for integration profile.
      majorVersion:
        type: integer
        format: int64
        description: Major Version of the integration profile
  PackageKey:
    type: string
    description: A user scoped package key that's used to lookup the respective driver
      record
    example: smartthings.zigbee.bulb-rgbw
    pattern: ^[a-zA-Z0-9 _/\\\-()\\[\\]{}\.]{1,36}$
  DriverName:
    description: The name of the driver
    type: string
    example: Generic Button
    format: ^[a-zA-Z0-9 _\/\\-()\[\]{}\.]{1,50}$
  DriverFingerprint:
    type: object
    properties:
      id:
        $ref: '#/definitions/FingerprintId'
      type:
        $ref: '#/definitions/FingerprintType'
      deviceLabel:
        $ref: '#/definitions/FingerprintDeviceLabel'
      zigbeeGeneric:
        $ref: '#/definitions/ZigbeeGenericFingerprint'
      zigbeeManfacturer:
        $ref: '#/definitions/ZigbeeManufacturerFingerprint'
      zwaveManufacturer:
        $ref: '#/definitions/ZWaveManufacturerFingerprint'
      zwaveGeneric:
        $ref: '#/definitions/ZWaveGenericFingerprint'
    required:
    - id
    - type
  FingerprintId:
    type: string
    description: The identifier for the respective fingerprint, unique per driver
    example: smartthings.motion-v4
    format: ^[a-zA-Z0-9 _/\\\-()\\[\\]{}\.]{1,36}$
  FingerprintType:
    type: string
    description: Type of fingerprint
    enum:
    - DTH
    - ZIGBEE_GENERIC
    - ZIGBEE_MANUFACTURER
    - ZWAVE_MANUFACTURER
    - ZWAVE_GENERIC
  FingerprintDeviceLabel:
    type: string
    format: ^[a-zA-Z0-9 _\/\\-()\[\]{}\.]{1,50}$
    description: Label assigned to device at join time. If this is not set the driver
      name is used.
    example: Motion Sensor
  ZigbeeGenericFingerprint:
    type: object
    properties:
      clusters:
        $ref: '#/definitions/Clusters'
      deviceIdentifiers:
        $ref: '#/definitions/DeviceIdentifiers'
      zigbeeProfiles:
        $ref: '#/definitions/ZigbeeProfiles'
      deviceIntegrationProfileKey:
        $ref: '#/definitions/DeviceIntegrationProfileKey'
  ZigbeeProfiles:
    type: array
    description: Device profiles associated with a generic zigbee fingerprint
    example:
    - 260
    items:
      type: integer
      example: 260
  ZigbeeManufacturer:
    type: string
    description: Reported manufacturer of the device
    example: SmartThings
    minLength: 0
    maxLength: 32
  ZigbeeModel:
    type: string
    description: Reported model of the device
    example: motionv4
    minLength: 0
    maxLength: 32
  ZigbeeManufacturerFingerprint:
    type: object
    properties:
      manufacturer:
        $ref: '#/definitions/ZigbeeManufacturer'
      model:
        $ref: '#/definitions/ZigbeeModel'
      deviceIntegrationProfileKey:
        $ref: '#/definitions/DeviceIntegrationProfileKey'
  ZWaveManufacturerFingerprint:
    type: object
    properties:
      manufacturerId:
        $ref: '#/definitions/ZWaveManufacturerId'
      productId:
        $ref: '#/definitions/ZWaveProductId'
      productType:
        $ref: '#/definitions/ZWaveProductType'
      deviceIntegrationProfileKey:
        $ref: '#/definitions/DeviceIntegrationProfileKey'
    required:
    - id
    - productType
  ZWaveManufacturerId:
    type: integer
    description: 16-bit manufacturer identifier assigned by the Z-Wave Specification
    minimum: 0
    maximum: 65535
    example: 134
  ZWaveProductId:
    type: integer
    description: 16-bit manufacturer defined product identifier
    minimum: 0
    maximum: 65535
    example: 12336
  ZWaveProductType:
    type: integer
    description: 16-bit manufacturer defined product type
    minimum: 0
    maximum: 65535
    example: 17488
  ZWaveGenericFingerprint:
    type: object
    properties:
      genericType:
        $ref: '#/definitions/ZWaveGenericType'
      specificType:
        type: array
        description: List of reported command classes
        items:
          $ref: '#/definitions/ZWaveSpecificType'
      commandClasses:
        description: List of CommandClasses to match on
        $ref: '#/definitions/CommandClasses'
      deviceIntegrationProfileKey:
        $ref: '#/definitions/DeviceIntegrationProfileKey'
  ZWaveGenericType:
    type: integer
    description: 8-bit indicator for the generic type of the device
    minimum: 0
    maximum: 255
    example: 6
  ZWaveSpecificType:
    type: integer
    description: 8-bit indicator for the specific type of the device
    minimum: 0
    maximum: 255
    example: 6
  CommandClasses:
    type: object
    properties:
      either:
        type: array
        description: List of 8-bit command class identifiers to match regardless of
          controlled or supported
        items:
          type: integer
          minimum: 0
          maximum: 255
          example: 25
      controlled:
        type: array
        description: List of 8-bit command class identifiers that are controlled
        items:
          type: integer
          minimum: 0
          maximum: 255
          example: 25
      supported:
        type: array
        description: List of 8-bit command class identifiers that are supported
        items:
          type: integer
          minimum: 0
          maximum: 255
          example: 25
  PagedDrivers:
    description: A paginated array of Drivers.
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/PagedDriver'
      _links:
        $ref: '#/definitions/Links'
    required:
    - items
    - _links
  Clusters:
    type: object
    properties:
      client:
        $ref: '#/definitions/ClientClusters'
      server:
        $ref: '#/definitions/ServerClusters'
  ClientClusters:
    type: array
    description: List of 16-bit cluster identifiers for client clusters
    items:
      type: integer
      minimum: 0
      maximum: 65535
      example: 25
  ServerClusters:
    type: array
    description: List of 16-bit cluster identifiers for server clusters
    items:
      type: integer
      minimum: 0
      maximum: 65535
      example: 1280
  DeviceIdentifiers:
    type: array
    description: Device Identifiers associated with a generic zigbee fingerprint
    example:
    - 257
    items:
      type: integer
      example: 257
  BasicChannel:
    type: object
    properties:
      name:
        type: string
        description: Name of the channel
      description:
        type: string
        description: Description of the channel
      type:
        $ref: '#/definitions/ChannelType'
      termsOfServiceUrl:
        type: string
        description: URL for a developer-provided Terms of Service agreement for the
          channel
  ChannelType:
    type: string
    description: The type of channel
    enum:
    - DRIVER
  ChannelId:
    type: string
    format: uuid
    description: The identifier of the Sprocket channel
    example: 9314a926-528c-403f-ae56-4b0d059381dd
  DetailedChannel:
    type: object
    properties:
      channelId:
        $ref: '#/definitions/ChannelId'
      name:
        type: string
        description: Name of the channel
      description:
        type: string
        description: Description of the channel
      type:
        $ref: '#/definitions/ChannelType'
      termsOfServiceUrl:
        type: string
        description: URL for a developer-provided Terms of Service agreement for the
          channel
