  dpInfo:
    type: array
    description: Information used for obtaining details page plugins on different
      platforms. Array of Details page link objects.
    items:
      type: object
      required:
      - os
      - dpUri
      properties:
        os:
          type: string
          description: 'The OS of the UI Client used to show the details page. ''iOS'':
            iOS SmartThings ''android'': Android SmartThings'
          enum:
          - android
          - ios
          - tizen
          - web
        dpUri:
          type: string
          description: This is linked to obtain the vendor-specific device details
            page. The device's dashboard card opens the detail view using this link
            when the user clicks the device card.
          example: plugin://example_detail_page_uri
        serverDpUri:
          type: string
          description: This is linked to obtain the vendor-specific device details
            page. The device's dashboard card opens the hosted detail view using this
            link when the user clicks the device card.
          example: http://hosted_page_url
        operatingMode:
          type: string
          description: This describes operating mode after onboarding. `easySetup`
            will launch the plugin for setting up your device while `deviceControl`
            will launch the plugin for controlling the device directly after onboarding.
        arguments:
          description: Complex devices can have sub dashboard cards and can pass an
            argument to the detailView when user clicks each sub dashboard cards.
          type: array
          items:
            type: object
            properties:
              key:
                description: To specify key of `group` used in `dashboard`
                type: string
                example: '{{___PO_CODE_SMARTTHINGS_FLEX_OVEN}}'
              value:
                description: To specify group as an argument while launching the detailView.
                type: string
                example: FLEX_UPPER_OVEN
            required:
            - key
            - value
  dpInfos:
    type: array
    description: Multiple dpInfos according to `stPluginApiVersion` property Both
      `dpInfo` and `dpInfos` can not be defined simultaneously.
    items:
      type: object
      required:
      - dpInfo
      properties:
        stPluginApiVersion:
          $ref: '#/definitions/stPluginApiVersion'
        dpInfo:
          $ref: '#/definitions/dpInfo'
  stPluginApiVersion:
    type: string
    pattern: ^[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}$
    description: |
      Minimum supported details page plugin's API version.
    example: 1.19.1
  alternatives:
    type: array
    items:
      $ref: '#/definitions/alternativeItem'
    description: A collection of strings that can replace the attribute value in the
      `label` or `value` or `unit`. Must be human-readable for the UI client to display.
  alternativeItem:
    type: object
    required:
    - key
    - value
    properties:
      key:
        type: string
        description: The label string to be displayed when the 'key' is evaluated.
        example: 'on'
      value:
        type: string
        description: The alternative string to be displayed when the `key` is selected.
        example: Motion detected
      type:
        type: string
        enum:
        - inactive
        - active
        default: active
        description: This shows the active or inactive state of the value. `active`
          is shown in color, while `inactive` value is shown dimmed in the UI view.
          For example, Motion sensor capability would have `detected` as active and
          in color and `clear` as inactive and dimmed so that a user can see the `detected`
          event easily.
      iconUrl:
        $ref: '#/definitions/iconUrl'
      description:
        type: string
        description: Additional description for each value. This description is shown
          in detail view or automation under this particular key.
  iconUrl:
    type: string
    description: Icon Id used to retrieve icons to be drawn on the UI Client. If iconUrl
      is omitted, then UI client shows default icon of device's category.
    example: icon://example_icon_url
  icons:
    type: array
    items:
      type: object
      description: To specify device's icon on the UI Client and conditions to show
        that icon.
      properties:
        group:
          type: string
          default: main
        iconUrl:
          $ref: '#/definitions/iconUrl'
        runningConditions:
          type: array
          description: To specify the condition whether the device is running or not,
            and a device icon corresponding to running is displayed on the UI.
          items:
            $ref: '#/definitions/visibleCondition'
        badge:
          type: array
          items:
            type: object
            properties:
              iconUrl:
                $ref: '#/definitions/iconUrl'
              visibleConditions:
                type: array
                items:
                  $ref: '#/definitions/visibleCondition'
            required:
            - iconUrl
        productKeys:
          type: array
          description: Condition that determines whether to show the corresponding
            icon or not. It is considered as satisfied if this field does not exist,
            and the first satisfied icon will be shown.
          items:
            type: object
            properties:
              mnId:
                type: string
              setupId:
                type: string
            required:
            - mnId
            - setupId
  step:
    description: The incremental step that increases or decreases for numeric values.
    type: number
    format: double
    default: 1.0
  range:
    type: array
    description: The inclusive range of a numeric value or bounds of a string depending
      on the data type it is applied to.
    items:
      type: number
      format: double
    maxItems: 2
    minItems: 2
    example:
    - 0
    - 100
  operator:
    type: string
    description: The method to compare
    enum:
    - CONTAINS
    - DOES_NOT_CONTAIN
    - EQUALS
    - DOES_NOT_EQUAL
    - GREATER_THAN
    - GREATER_THAN_OR_EQUALS
    - LESS_THAN
    - LESS_THAN_OR_EQUALS
    - ONE_OF
  version:
    description: The version number of the capability.
    type: integer
    example: 1
    default: 1
  mnmn:
    type: string
    description: The name of the manufacturer
    example: SmartThingsCommunity
  vid:
    type: string
    description: A unique identifier for the presentation of a device. This can be
      a model number on legacy device integrations, but also may be a system generated
      UUID based on a device's structure and display configuration.
    example: MySmartDevice
  capabilityKey:
    type: object
    properties:
      capability:
        type: string
      version:
        $ref: '#/definitions/version'
    required:
    - capability
    example:
      capability: switch
      version: 1
  component:
    type: string
    example: main
    default: main
  formattedLabel:
    type: string
    description: |
      This displays a string. This can be a formatted string with variables.
      Example: `{{attribute.value}} {{attribute.unit}}` (where `attribute` is the name of an attribute in your capability)
    example: '{{temperatureMeasurement.value}}'
  state:
    description: This display type creates a state UI that shows state only.
    type: object
    properties:
      label:
        $ref: '#/definitions/formattedLabel'
      unit:
        $ref: '#/definitions/unit'
      alternatives:
        $ref: '#/definitions/alternatives'
    required:
    - label
  supportedValues:
    type: string
    description: The attribute name specified in supportedValues is an array that
      has values supported at runtime.
    pattern: (^[[a-z]*([A-Z][a-z]*)*){1,36}(\.value)+
    example: supportedThermostatModes.value
  supportedValuesForNumericConstraints:
    type: string
    description: To specify an attribute path that has a dynamic numeric constraint.
      The constraint can be updated in real-time to reflect changing values and ranges.
    pattern: (^[[a-z]*([A-Z][a-z]*)*){1,36}(\.value)+
    example: supportedVolumes.value
  visibleConditionBase:
    type: object
    description: Use `visibleCondition` to specify under what conditions the resource
      may be interacted with from the UI. When the specified condition is met, the
      resource may be interacted with from the UI. If the condition is not met, the
      resource will appear grayed out and unusable in the UI in the detail view; all
      other views, including the dashboard, will not display the resource. If `visibleCondition`
      is omitted, the resource is always displayed and may be interacted with from
      the UI. The `visibleCondition` object may reference a different component, capability,
      and version.
    properties:
      value:
        $ref: '#/definitions/value'
      valueType:
        $ref: '#/definitions/valueType'
      operator:
        $ref: '#/definitions/operator'
      operand:
        type: string
        description: The value that the visible condition evaluates against.
    example:
      value: switch.value
      operator: EQUALS
      operand: 'on'
    required:
    - value
    - operand
    - operator
  visibleCondition:
    allOf:
    - $ref: '#/definitions/visibleConditionBase'
    - type: object
      properties:
        component:
          $ref: '#/definitions/component'
          description: The component that controls the visibility of this component.
            This can be another component or this one.
        capability:
          type: string
        version:
          $ref: '#/definitions/version'
      example:
        capability: switch
        component: main
        version: 1
      required:
      - component
      - capability
  visibleConditionForDashboardState:
    allOf:
    - $ref: '#/definitions/visibleCondition'
    - type: object
      properties:
        isOffline:
          type: boolean
          default: false
          description: To specify whether the `visibleCondition` is to be evaluated
            when device health is `offline` or not.
  visibleConditionsWithOperator:
    type: object
    properties:
      operator:
        $ref: '#/definitions/operatorForVisibleConditions'
      visibleConditions:
        type: array
        items:
          $ref: '#/definitions/visibleCondition'
  operatorForVisibleConditions:
    type: string
    description: The `operator` is to specify the `AND/OR` logical operator which
      is used to combine multiple conditions specified in the `visibleConditions`.
      The `AND` operator requires all conditions to be true in order to evaluate as
      true. On the other hand, the `OR` operator evaluates as true if either condition
      is true.
    enum:
    - AND
    - OR
    default: OR
  hideOnUnmatchForVisibleCondition:
    type: boolean
    description: A flag indicating the two ways of unavailability for a UI component
      when the `visibleCondition(s)` is not met. The `true` indicates that target
      UI component is completely hidden. On the other hand, the `false` indicates
      that target UI component is still displayed but in an uncontrollable state.
    default: false
  hideDashboardActions:
    type: boolean
    description: To hide the action button corresponding to `dashboard.actions` when
      the card is extended, if the extended area provides sufficient functionality.
    default: false
  visibleConditionForDetailView:
    allOf:
    - $ref: '#/definitions/visibleCondition'
    - type: object
      properties:
        hideOnUnmatch:
          $ref: '#/definitions/hideOnUnmatchForVisibleCondition'
  presentationItemWithValue:
    allOf:
    - $ref: '#/definitions/capabilityKeyWithComponent'
    - type: object
      properties:
        value:
          $ref: '#/definitions/value'
        valueType:
          $ref: '#/definitions/valueType'
  capabilityKeyWithComponent:
    allOf:
    - $ref: '#/definitions/capabilityKey'
    - type: object
      properties:
        component:
          type: string
      required:
      - component
  groupVisibleConditions:
    allOf:
    - $ref: '#/definitions/visibleConditionBase'
    - type: object
      properties:
        component:
          $ref: '#/definitions/component'
          description: The component that controls the visibility of this component.
            This can be another component or this one.
        capability:
          type: string
        version:
          $ref: '#/definitions/version'
      example:
        capability: switch
        component: main
        version: 1
      required:
      - component
      - capability
  dashboard:
    type: object
    properties:
      states:
        type: array
        items:
          $ref: '#/definitions/statesArrayItem'
      actions:
        type: array
        items:
          $ref: '#/definitions/actionsArrayItem'
      basicPlus:
        type: array
        items:
          $ref: '#/definitions/basicPlusItemForPresentation'
      groupVisibleConditions:
        $ref: '#/definitions/groupVisibleConditions'
  dashboardForCapability:
    type: object
    description: The dashboard is the main view in the SmartThings app that shows
      a list of devices and their state.
    properties:
      states:
        type: array
        items:
          $ref: '#/definitions/stateItem'
      actions:
        type: array
        items:
          $ref: '#/definitions/actionItem'
      panelItems:
        type: array
        items:
          $ref: '#/definitions/panelItemForCapability'
  stateItem:
    type: object
    properties:
      label:
        $ref: '#/definitions/formattedLabel'
      alternatives:
        $ref: '#/definitions/alternatives'
    required:
    - label
    example:
      label: 'Motion: {{motion.value}}'
      alternatives:
      - key: detected
        value: Detected
        type: active
      - key: clear
        value: None
        type: inactive
  actionItem:
    type: object
    properties:
      displayType:
        type: string
        description: To specify the type of UI component to display this action or
          state. The corresponding field must also be included. For example, if you
          specify "switch" here, you must also include the "switch" key and its object
          definition for this action or state.
        enum:
        - pushButton
        - toggleSwitch
        - switch
        - standbyPowerSwitch
        - statelessPowerToggle
        - playPause
        - playStop
      pushButton:
        $ref: '#/definitions/pushButton'
      toggleSwitch:
        $ref: '#/definitions/toggleSwitchForDashboard'
      switch:
        $ref: '#/definitions/switchForDashboard'
      standbyPowerSwitch:
        $ref: '#/definitions/standbyPowerSwitchForDashboard'
      statelessPowerToggle:
        $ref: '#/definitions/statelessPowerToggleForDashboard'
      playPause:
        $ref: '#/definitions/playPause'
      playStop:
        $ref: '#/definitions/playStop'
      group:
        $ref: '#/definitions/group'
    required:
    - displayType
    example:
      displayType: switch
      switch:
        command:
          name: setLock
          'on': locked
          'off': unlocked
        state:
          value: lock.value
          'on': locked
          'off': unlocked
  basicPlusCamera:
    type: object
    description: To render the captured image and overlay icon in the dashboard card
      of a camera device.
    properties:
      image:
        type: object
        description: To specify attribute path for a captured image.
        properties:
          capability:
            type: string
          version:
            $ref: '#/definitions/version'
          component:
            $ref: '#/definitions/component'
            description: The component that controls the visibility of this component.
              This can be another component or this one.
          value:
            $ref: '#/definitions/value'
        required:
        - component
        - capability
        - value
      overlayIcons:
        type: array
        description: To describe the overlay icon and the conditions under which it
          will be displayed.
        items:
          type: object
          properties:
            iconUrl:
              type: string
              description: Icon Id used to retrieve a overlay icon to be drawn on
                the camera card.
            visibleCondition:
              $ref: '#/definitions/visibleCondition'
          required:
          - iconUrl
    required:
    - image
    example:
      image:
        capability: imageCapture
        component: main
        version: 1
        value: image.value
      overlayIcons:
      - iconUrl: example_motion_icon
        visibleCondition:
          capability: motionSensor
          component: main
          version: 1
          value: motion.value
          operator: EQUALS
          operand: detected
      - iconUrl: example_object_human_icon
        visibleCondition:
          capability: objectDetection
          component: main
          version: 1
          value: detected.value.value
          operator: EQUALS
          operand: human
      - iconUrl: example_object_pet_icon
        visibleCondition:
          capability: objectDetection
          component: main
          version: 1
          value: detected.value.value
          operator: EQUALS
          operand: pet
  basicPlusTv:
    type: object
    description: To display the remote control on the dashboard card for a TV device.
    properties:
      volume:
        type: object
        description: To describe the remote volume control which can trigger "increase"
          and "decrease" commands of a TV. The user must specify either a "command"
          field alone or "increase" / "decrease" fields for commands without an argument.
        properties:
          capability:
            type: string
          version:
            $ref: '#/definitions/version'
          component:
            $ref: '#/definitions/component'
          label:
            type: string
          command:
            type: object
            properties:
              name:
                type: string
                description: To specify a single command like "setValue(number)",
                  use "command" field for the command name. If this field is specified
                  then "increase" and "descrease" fields should not be specified.
                  App will calculate desired value when user clicks "+" and "-" button
                  in the UI based on the current value of "attribute" with specified
                  "step".
              increase:
                type: string
                description: To specify a command for "increase" without an argument.
              decrease:
                type: string
                description: To specify a command for "decrease" without an argument.
          value:
            $ref: '#/definitions/value'
          step:
            $ref: '#/definitions/step'
          range:
            $ref: '#/definitions/range'
          supportedValues:
            $ref: '#/definitions/supportedValuesForNumericConstraints'
        required:
        - component
        - capability
        - command
        example:
          capability: audioVolume
          component: main
          version: 1
          label: Volume
          command:
            name: setVolume
          step: 1
          range:
          - 0
          - 100
          supportedValues: supportedVolumes.value
      buttons:
        minItems: 1
        maxItems: 3
        type: array
        items:
          $ref: '#/definitions/buttonForTv'
      channel:
        type: object
        description: To describe the remote channel control of a TV
        properties:
          capability:
            type: string
          version:
            $ref: '#/definitions/version'
          component:
            $ref: '#/definitions/component'
          label:
            type: string
          value:
            $ref: '#/definitions/value'
          command:
            type: object
            properties:
              name:
                type: string
                description: A name refers to command name and key of the increase
                  or decrease is the argument of the command
              increase:
                type: string
                description: To specify a name of a command or an argument used to
                  increase TV channels
              decrease:
                type: string
                description: To specify a name of a command or an argument used to
                  decrease TV channels
        required:
        - capability
        - component
        - command
        example:
          capability: tvChannel
          component: main
          version: 1
          label: Channel
          value: tvChannel.value
          command:
            increase: channelUp
            decrease: channelDown
      directionalPad:
        type: object
        description: To describe the remote directional pad for a TV
        properties:
          capability:
            type: string
          version:
            $ref: '#/definitions/version'
          component:
            $ref: '#/definitions/component'
          command:
            type: object
            properties:
              name:
                type: string
                description: name refers to command name and keys of the others are
                  the arguments of the command
              up:
                type: string
                description: To specify a name of a command or an argument used to
                  press the key up
              down:
                type: string
                description: To specify a name of a command or an argument used to
                  press the key down
              left:
                type: string
                description: To specify a name of a command or an argument used to
                  press the key left
              right:
                type: string
                description: To specify a name of a command or an argument used to
                  press the key right
              ok:
                type: string
                description: To specify a name of a command or an argument used to
                  press the key ok
            required:
            - up
            - down
            - left
            - right
            - ok
        required:
        - component
        - capability
        - command
        example:
          capability: custom.remoteControl
          component: main
          version: 1
          command:
            name: send
            up: UP
            down: DOWN
            left: LEFT
            right: RIGHT
            ok: OK
      operator:
        $ref: '#/definitions/operatorForVisibleConditions'
      visibleConditions:
        type: array
        items:
          $ref: '#/definitions/visibleCondition'
      hideDashboardActions:
        $ref: '#/definitions/hideDashboardActions'
    required:
    - buttons
  buttonForTv:
    allOf:
    - $ref: '#/definitions/capabilityKey'
    - type: object
      properties:
        component:
          $ref: '#/definitions/component'
        command:
          type: string
        argument:
          type: string
        iconUrl:
          type: string
      required:
      - component
      - command
      example:
        capability: audioVolume
        component: main
        version: 1
        command: mute
        iconUrl: icon://mute
  basicPlusLight:
    type: object
    description: To display the dimmer and color control on the dashboard card for
      a lighting device.
    properties:
      dimmer:
        $ref: '#/definitions/sliderForLight'
      colorTemperature:
        $ref: '#/definitions/sliderForLight'
      colorControl:
        type: object
        description: To display the dimmer and color control on the dashboard card
          for a lighting device.
        properties:
          component:
            type: string
            example: main
          capability:
            type: string
            example: thermostatMode
          version:
            $ref: '#/definitions/version'
          command:
            type: string
          value:
            $ref: '#/definitions/value'
          color:
            type: object
            description: To specify the values of attributes which indecate the hue
              and saturation that make up the color.
            properties:
              hue:
                $ref: '#/definitions/value'
              saturation:
                $ref: '#/definitions/value'
        required:
        - component
        - capability
        - command
        - color
        example:
          capability: colorControl
          component: main
          version: 1
          command: setColor
          value: color.value
          color:
            hue: hue.value
            saturation: saturation.value
      hideDashboardActions:
        $ref: '#/definitions/hideDashboardActions'
    required:
    - dimmer
  sliderForLight:
    allOf:
    - $ref: '#/definitions/deviceConfigEntryBase'
    - $ref: '#/definitions/sliderBase'
    - type: object
      properties:
        command:
          type: string
          description: The command name that adjusts the dimmer or color temperature
            level of a lighting device.
          example: setLevel
        value:
          $ref: '#/definitions/value'
        valueType:
          $ref: '#/definitions/valueType'
        argumentType:
          $ref: '#/definitions/argumentType'
        label:
          type: string
      required:
      - command
      - value
      - label
    example:
      capability: switchLevel
      component: main
      version: 1
      label: Dimmer
      command: setLevel
      value: level.value
      unit: level.unit
      range:
      - 0
      - 100
  basicPlusActions:
    type: array
    description: To render the action component to be displayed only with the extended
      dashboard card.
    items:
      allOf:
      - $ref: '#/definitions/pushButtonWithIcon'
      - type: object
        properties:
          component:
            type: string
          capability:
            type: string
          version:
            $ref: '#/definitions/version'
          operator:
            $ref: '#/definitions/operatorForVisibleConditions'
          visibleConditions:
            type: array
            items:
              $ref: '#/definitions/visibleCondition'
        required:
        - component
        - capability
        example:
          capability: momentary
          component: main
          version: 1
  basicPlusStateBoard:
    type: array
    description: To render the `StateBoard` in order to display multiple states of
      device as a unified component on the extended device card.
    items:
      $ref: '#/definitions/basicPlusStateBoardItem'
  basicPlusStateBoardItem:
    allOf:
    - $ref: '#/definitions/presentationItemWithValue'
    - type: object
      properties:
        label:
          type: string
        unit:
          $ref: '#/definitions/unit'
        alternatives:
          $ref: '#/definitions/alternatives'
        iconUrl:
          type: string
          description: Icon Id used to retrieve icons to be drawn on the state board.
          example: icon://example_icon_url
        colors:
          type: array
          items:
            $ref: '#/definitions/basicPlusStateBoardColors'
    - $ref: '#/definitions/visibleConditionsWithOperator'
    required:
    - label
    - value
    example:
      capability: dustSensor
      component: main
      version: 1
      label: PM10
      value: dustLevel.value
      unit: dustLevel.unit
      colors:
      - color: '#47BCF5'
        operator: AND
        visibleConditions:
        - operator: EQUALS
          operand: good
  basicPlusStateBoardColors:
    type: object
    properties:
      color:
        description: The `color` is based on the `RGB-HEX code`. So `#FFA500` code
          can be defined for the `orange` color.
        type: string
        example: '#47BCF5'
      operator:
        $ref: '#/definitions/operatorForVisibleConditions'
      visibleConditions:
        type: array
        description: Use `visibleConditions` to specify under what conditions the
          font color determine. If `visibleConditions` is omitted, the color is always
          determined for the font color.
        items:
          $ref: '#/definitions/visibleConditionForColorItem'
    required:
    - color
  visibleConditionForColorItem:
    type: object
    properties:
      referTo:
        type: object
        description: To specify a `referTo` that contains another `component/capability/version/attribute`
          to be referred for determining the color item. If this is omitted then `component/capability/version/attribute`
          specified in the `StateBoard item` is referred.
        properties:
          component:
            $ref: '#/definitions/component'
            description: The component that controls the visibility of this component.
              This can be another component or this one.
          capability:
            type: string
          version:
            $ref: '#/definitions/version'
          value:
            $ref: '#/definitions/value'
          valueType:
            $ref: '#/definitions/valueType'
        required:
        - component
        - capability
        - value
      operator:
        $ref: '#/definitions/operator'
      operand:
        type: string
        description: The value that the visible condition evaluates against.
    required:
    - operand
    - operator
  basicPlusProgressBars:
    type: array
    description: To render the progress bar component to be displayed only with the
      extended dashboard card.
    maxItems: 2
    items:
      type: object
      properties:
        headers:
          description: To specify the introductory labels of the progress bar.
          type: array
          items:
            $ref: '#/definitions/basicPlusProgressBarsStateItem'
        bar:
          $ref: '#/definitions/basicPlusProgressBarsBarItem'
        footers:
          description: To specify supplementary information of the progress bar.
          type: array
          items:
            $ref: '#/definitions/basicPlusProgressBarsStateItem'
        operator:
          $ref: '#/definitions/operatorForVisibleConditions'
        visibleConditions:
          type: array
          items:
            $ref: '#/definitions/visibleCondition'
      required:
      - component
      - capability
      example:
        capability: momentary
        component: main
        version: 1
  basicPlusProgressBarsBarItem:
    allOf:
    - $ref: '#/definitions/presentationItemWithValue'
    - type: object
      description: To render the bar UI displaying the current progress status relative
        to the total amount specified by `range` of work done.
      properties:
        range:
          type: array
          description: The inclusive range of a numeric value or bounds of a string
            depending on the data type it is applied to.
          items:
            type: number
            format: double
          maxItems: 2
          minItems: 2
          default:
          - 0.0
          - 100.0
      required:
      - value
  basicPlusProgressBarsStateItem:
    allOf:
    - $ref: '#/definitions/stateItem'
    - $ref: '#/definitions/capabilityKey'
    - type: object
      required:
      - component
      properties:
        component:
          $ref: '#/definitions/component'
        formatInfo:
          $ref: '#/definitions/formatInfo'
        iconUrl:
          type: string
          description: Icon Id used to retrieve icons to be drawn on the progress
            bar.
          example: icon://example_icon_url
        placement:
          description: To specify the placement of label
          type: string
          enum:
          - START
          - END
          default: START
  capabilityValueOptions:
    type: object
    properties:
      enabledValues:
        type: array
        description: A list of values supported among those defined in the capability
          alternatives. For instance, a device may not support `auto` for supported
          thermostat fan modes, so this field might be an array containing `on` and
          `off`.
        items:
          type: string
        example:
        - cooling
        - heating
      label:
        type: string
      alternatives:
        $ref: '#/definitions/alternatives'
      range:
        $ref: '#/definitions/range'
      step:
