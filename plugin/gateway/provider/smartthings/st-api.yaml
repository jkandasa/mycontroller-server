swagger: '2.0'
info:
  title: SmartThings API
  version: 1.0-PREVIEW
  description: |
    # Overview

    This is the reference documentation for the SmartThings API.

    The SmartThings API, a RESTful API, provides a method for your integration to communicate with the SmartThings Platform. The API is the core of the platform. It is used to control devices, create Automations, manage Locations, retrieve user and device information; if you want to communicate with the SmartThings platform, youâ€™ll be using the SmartThings API. All responses are sent as [JSON](http://www.json.org/).

    The SmartThings API consists of several endpoints, including Rules, Locations, Devices, and more. Even though each of these endpoints are not standalone APIs, you may hear them referred to as such. For example, the Rules API is used to build Automations.

    # Authentication

    Before using the SmartThings API, youâ€™ll need to obtain an Authorization Token. All SmartThings resources are protected with [OAuth 2.0 Bearer Tokens](https://tools.ietf.org/html/rfc6750#section-2.1) sent on the request as an `Authorization: Bearer <TOKEN>` header. Operations require specific OAuth scopes that specify the exact permissions authorized by the user.

    ## Authorization token types

    There are two types of tokens:
      * SmartApp tokens
      * Personal access tokens (PAT).

    ### SmartApp tokens

    SmartApp tokens are used to communicate between third-party integrations, or SmartApps, and the SmartThings API.
    When a SmartApp is called by the SmartThings platform, it is sent an authorization token that can be used to interact with the SmartThings API.

    ### Personal access tokens

    Personal access tokens are used to authorize interaction with the API for non-SmartApp use cases. When creating personal access tokens, you can specifiy the permissions granted to the token. These permissions define the OAuth2 scopes for the personal access token.

    Personal access tokens can be created and managed on the [personal access tokens page](https://account.smartthings.com/tokens).

    ## OAuth2 scopes

    Operations may be protected by one or more OAuth security schemes, which specify the required permissions.
    Each scope for a given scheme is required.
    If multiple schemes are specified (uncommon), you may use either scheme.

    SmartApp token scopes are derived from the permissions requested by the SmartApp and granted by the end-user during installation.
    Personal access token scopes are associated with the specific permissions authorized when the token is created.

    Scopes are generally in the form `permission:entity-type:entity-id`.

    **An `*` used for the `entity-id` specifies that the permission may be applied to all entities that the token type has access to, or may be replaced with a specific ID.**

    For more information about authorization and permissions, visit the [Authorization section](https://developer.smartthings.com/docs/getting-started/authorization-and-permissions) in the SmartThings documentation.

    <!-- ReDoc-Inject: <security-definitions> -->

    # Errors

    The SmartThings API uses conventional HTTP response codes to indicate the success or failure of a request.

    In general:

    * A `2XX` response code indicates success
    * A `4XX` response code indicates an error given the inputs for the request
    * A `5XX` response code indicates a failure on the SmartThings platform

    API errors will contain a JSON response body with more information about the error:

    ```json
    {
      "requestId": "031fec1a-f19f-470a-a7da-710569082846"
      "error": {
        "code": "ConstraintViolationError",
        "message": "Validation errors occurred while process your request.",
        "details": [
          { "code": "PatternError", "target": "latitude", "message": "Invalid format." },
          { "code": "SizeError", "target": "name", "message": "Too small." },
          { "code": "SizeError", "target": "description", "message": "Too big." }
        ]
      }
    }
    ```

    ## Error Response Body

    The error response attributes are:

    | Property | Type | Required | Description |
    | --- | --- | --- | --- |
    | requestId | String | No | A request identifier that can be used to correlate an error to additional logging on the SmartThings servers.
    | error | Error | **Yes** | The Error object, documented below.

    ## Error Object

    The Error object contains the following attributes:

    | Property | Type | Required | Description |
    | --- | --- | --- | --- |
    | code | String | **Yes** | A SmartThings-defined error code that serves as a more specific indicator of the error than the HTTP error code specified in the response. See [SmartThings Error Codes](#section/Errors/SmartThings-Error-Codes) for more information.
    | message | String | **Yes** | A description of the error, intended to aid debugging of error responses.
    | target | String | No | The target of the error. For example, this could be the name of the property that caused the error.
    | details | Error[] | No | An array of Error objects that typically represent distinct, related errors that occurred during the request. As an optional attribute, this may be null or an empty array.

    ## Standard HTTP Error Codes

    The following table lists the most common HTTP error responses:

    | Code | Name | Description |
    | --- | --- | --- |
    | 400 | Bad Request | The client has issued an invalid request. This is commonly used to specify validation errors in a request payload.
    | 401 | Unauthorized | Authorization for the API is required, but the request has not been authenticated.
    | 403 | Forbidden | The request has been authenticated but does not have appropriate permissions, or a requested resource is not found.
    | 404 | Not Found | The requested path does not exist.
    | 406 | Not Acceptable | The client has requested a MIME type via the Accept header for a value not supported by the server.
    | 415 | Unsupported Media Type | The client has defined a contentType header that is not supported by the server.
    | 422 | Unprocessable Entity | The client has made a valid request, but the server cannot process it. This is often used for APIs for which certain limits have been exceeded.
    | 429 | Too Many Requests | The client has exceeded the number of requests allowed for a given time window.
    | 500 | Internal Server Error | An unexpected error on the SmartThings servers has occurred. These errors are generally rare.
    | 501 | Not Implemented | The client request was valid and understood by the server, but the requested feature has yet to be implemented. These errors are generally rare.

    ## SmartThings Error Codes

    SmartThings specifies several standard custom error codes.
    These provide more information than the standard HTTP error response codes.
    The following table lists the standard SmartThings error codes and their descriptions:

    | Code | Typical HTTP Status Codes | Description |
    | --- | --- | --- |
    | PatternError | 400, 422 | The client has provided input that does not match the expected pattern.
    | ConstraintViolationError | 422 | The client has provided input that has violated one or more constraints.
    | NotNullError | 422 | The client has provided a null input for a field that is required to be non-null.
    | NullError | 422 | The client has provided an input for a field that is required to be null.
    | NotEmptyError | 422 | The client has provided an empty input for a field that is required to be non-empty.
    | SizeError | 400, 422 | The client has provided a value that does not meet size restrictions.
    | Unexpected Error | 500 | A non-recoverable error condition has occurred. A problem occurred on the SmartThings server that is no fault of the client.
    | UnprocessableEntityError | 422 | The client has sent a malformed request body.
    | TooManyRequestError | 429 | The client issued too many requests too quickly.
    | LimitError | 422 | The client has exceeded certain limits an API enforces.
    | UnsupportedOperationError | 400, 422 | The client has issued a request to a feature that currently isn't supported by the SmartThings platform. These errors are generally rare.

    ## Custom Error Codes

    An API may define its own error codes where appropriate.
    Custom error codes are documented in each API endpoint's documentation section.

    # Warnings
    The SmartThings API issues warning messages via standard HTTP Warning headers. These messages do not represent a request failure, but provide additional information that the requester might want to act upon.
    For example, a warning will be issued if you are using an old API version.

    # API Versions

    The SmartThings API supports both path and header-based versioning.
    The following are equivalent:

    - https://api.smartthings.com/v1/locations
    - https://api.smartthings.com/locations with header `Accept: application/vnd.smartthings+json;v=1`

    Currently, only version 1 is available.

    # Paging

    Operations that return a list of objects return a paginated response.
    The `_links` object contains the items returned, and links to the next and previous result page, if applicable.

    ```json
    {
      "items": [
        {
          "locationId": "6b3d1909-1e1c-43ec-adc2-5f941de4fbf9",
          "name": "Home"
        },
        {
          "locationId": "6b3d1909-1e1c-43ec-adc2-5f94d6g4fbf9",
          "name": "Work"
        }
        ....
      ],
      "_links": {
        "next": {
          "href": "https://api.smartthings.com/v1/locations?page=3"
        },
        "previous": {
          "href": "https://api.smartthings.com/v1/locations?page=1"
        }
      }
    }
    ```

    # Allowed Permissions

    The response payload to a request for a SmartThings entity (e.g. a location or a device) may contain an
    `allowed` list property.  This list contains strings called **action identifiers** (such as `w:locations`)
    that provide information about what actions are permitted by the user's token on that entity at the time the request was
    processed.

    The action identifiers are defined in the API documentation for the 200 response of the particular endpoint queried.
    For each documented action identifier (e.g. `w:locations`), you will find a description of the user action
    (e.g. "edit the name of the location") associated with that identifier. The endpoint documentation will contain a
    complete list of the action identifiers that may appear in the allowed list property.

    If the `allowed` list property is present in the response payload:
    * the user action documented for an action identifier present in the list is permitted for the user on the entity at the time the request is processed
    * the user action documented for an action identifier **not** present in the list is **not** permitted to the user on the entity at the time the request is processed

    If the `allowed` list property is **not** present or has a `null` value in the response payload, then the response provides **no information**
    about any user actions being permissible except that the user has permission to view the returned entity.

    The response provides **no information** about the permissibility of user actions that are not specifically mentioned
    in the documentation for the particular endpoint.

    The table below is a high-level guide to interpreting action identifiers.  It does not indicate
    that any given endpoint will document or return any of the action identifiers listed below.
    Remember that the endpoint API documentation is the final source of truth for interpreting action identifiers in a response payload.

    | Action Identifier Format | Examples | Meaning |
    | --- | --- | --- |
    | `w:grant:`\<grant type> | `w:grant:share` on a location payload | User may **bestow** the grant type on the entity to another user (e.g. through an invitation.) |
    | `r:`\<child type> | `r:devices` on a location payload | User may **list and view** child type entities of the returned entity.  NOTE: there may be finer-grained controls on the child type entities. |
    | `l:`\<child type> | `l:devices` on a location payload | User may **list and summarize** child type entities of the returned entity.  NOTE: there may be finer-grained controls on the child type entities.  This is weaker than `r:`\<child type> and rarely used. |
    | `w:`\<child type> | `w:devices` on a location payload | User may **create** entities of the child type as children of the returned entity. |
    | `x:`\<child type> | `x:devices` on a location payload | User may **execute commands** on child type entities of the returned entity.  NOTE: there may be finer-grained controls on the child type entities. |
    | `r:`\<entity type> | `r:locations` on a location payload | This will only be returned in a list/summary response and only in a case when the list/summary is designed not to show all the details of the entity. |
    | `w:`\<entity type> | `w:locations` on a location payload<br/>`w:devices` on a device payload | User may **edit** specifically-documented properties of the returned entity. |
    | `x:`\<entity type> | `x:devices` on a device payload | user may **execute commands** on the returned entity.  NOTE: there may be finer-grained controls on the children of the entity. |
    | `d:`\<entity type> | `d:locations` on a location payload | User may **delete** the returned entity. |
    | `r:`\<entity type>`:`\<attribute group> | `r:locations:currentmode` on a location payload | User may **view** the specified (and clearly-documented) attribute or attribute group of the returned entity. |
    | `w:`\<entity type>`:`\<attribute group> | `w:locations:geo` on a location payload | User may **edit** the specified (and clearly-documented) attribute or attribute group of the returned entity. |
    | `x:`\<entity type>`:`\<attribute group> | `x:devices:switch` on a device payload | User may **execute commands** on the specified (and clearly-documented) attribute or attribute group of the returned entity. |

    # Localization

    Some SmartThings APIs support localization.
    Specific information regarding localization endpoints are documented in the API itself.
    However, the following applies to all endpoints that support localization.

    ## Fallback Patterns

    When making a request with the `Accept-Language` header, the following fallback pattern is observed:
    1. Response will be translated with exact locale tag.
    2. If a translation does not exist for the requested language or region, English (en) will be returned.
    3. If the requested language exists, but the translation does not exist for the requested region: The requested language will be returned.
      e.g. for zh-HK which is (Chinese)-(Hong Kong), if the region translation for Hong Kong did not exist, Chinese would be returned.

    ## Accept-Language Header
    The format of the `Accept-Language` header follows what is defined in [RFC 7231, section 5.3.5](https://tools.ietf.org/html/rfc7231#section-5.3.5)

    ## Content-Language
    The `Content-Language` header should be set on the response from the server to indicate which translation was given back to the client.
    The absense of the header indicates that the server did not recieve a request with the `Accept-Language` header set.
schemes:
- https
basePath: /v1/
produces:
- application/json
tags:
- name: Locations
  description: |
    Locations are created by users for grouping hubs, devices, and
    automations together into a logical group and are usually tagged with a
    geolocation.

    Locations can be identified and managed using the LocationID. You can
    have up to 10 Locations associated with a user.
- name: Rooms
  description: |
    Rooms are a subgroup that exists inside a Location. A room is used to group Devices and Hubs.
- name: Modes
  description: |
    A Location has a number of Modes that users can switch between, such as â€œHomeâ€� or â€œAway.â€� These Modes can act as automation conditions (only run when Location is in a certain Mode) and triggers (run when switching to a certain Mode). A Location is always in a Mode, and must have at least one Mode at all times.
- name: Rules
  description: |
    The Rules API is used to create, edit, and execute Rules. You can use
    Rules to create a wide range of Automations that operate on the
    SmartThings Platform.

    Note that Rules created with the Rules API will not appear in the
    SmartThings app at this time.
- name: Scenes
  description: |
    Scenes allow you to simultaneously set a group of devices to a particular
    state. Scenes, unlike rules, do not have a specific trigger and are
    activated manually in the SmartThings app or by a Rule.
- name: Devices
  description: |
    The Devices API allows you to control Devices connected to the
    SmartThings Platform, access Device metadata, and access Device states.
- name: Profiles
  description: |
    A Device Profile is a data structure on the SmartThings Platform
    containing the definition of a Device. This definition consists of
    Components, Capabilities, and a Presentation (previously referred to as
    UI Metadata).

    This is also where Device Preferences, Component Restrictions,
    Capability Restrictions and Flexible Constraints for
    Capabilities can be defined.
- name: Preferences
  description: |
    Device Preferences are configurations that allow users to tweak the behavior of their devices.
    Common use-cases may be to set a temperature offset or enable or disable a feature.
- name: Capabilities
  description: |
    Capabilities are features, or building blocks, of a device. Capabilities
    provide a method for abstracting a Deviceâ€™s ability to interact with
    Automations and Services. Capabilities enable the SmartThings Platform to
    view a device by what it is capable of and take a unified approach to
    dealing with Capabilities.

    A Capability is composed of Attributes and/or
    Commands. Depending on the type of Device, a Capability may only have an
    Attribute or a Command; both are not required.

    The capabilities API is used to get the definitions of the capabilities that can be implemented by the connected device. Capability definitions include schemas for both attributes and command arguments.
- name: Presentations
  description: |
    Presentations define how the SmartThings app (or other clients) should
    present the Attributes and Commands of a Device in the user interface.

    Presentation currently supports how the Device is presented in three main
    areas of the SmartThings app: the Dashboard view, the Device details
    view, and the Automations view.
- name: Apps
  description: |
    Most SmartThings integrations are represented as SmartApps, or "Apps". A
    SmartApp is created and maintained by a developer or partner
    community.

    The Apps API allows you to create and modify an app before installing it to a user's account.
- name: Installedapps
  description: |
    Most SmartThings integrations are represented as SmartApps, or "Apps". A
    SmartApp is created and maintained by a developer or partner
    community. App installation
    involves an OAuth process that allows a user to accept any requested permissions. After authorization, an Installed
    App is created.

    The Installed App API allows clients to work with the various integrations created in a user's
    account.
- name: Schedules
  description: |
    Schedules allow integrations like "Apps" to be triggered at fixed or
    recurring times.
    The schedules API allows for functionality like setting timeouts in
    response to other events or
    actuating a device at a particular time of day.
- name: Subscriptions
  description: |
    Subscriptions allow integrations like "Apps" to be notified when events occur.
- name: Coordinate
  description: |
    Coordinate related services
- name: SchemaApps
  description: |
    SmartThings Schema is the quickest method of integrating your Cloud Connected Device with SmartThings (especially if your device is already working with Alexa or Google). It defines the interactions (JSON payloads) between the SmartThings Cloud and your existing cloud, allowing your products to return their current state to your cloud, and to handle commands from SmartThings. SmartThings Schema specifies an interaction type when sending a request to your server. In turn, your server responds with the appropriate information in a JSON payload.
- name: InstalledSchemaApps
  description: |
    SmartThings associates Schema app installs with the user location specified during Schema app installation. This endpoint allows you to retrieve ISAs (InstalledSchemaApps) for a given ISA ID or location, and delete ISAs.
- name: OAuth
  description: |
    APIs around oauth tokens that partners can leverage for proactive device events.
- name: Drivers
  description: |
    A Driver is a piece of code that describes everything necessary to integrate a device into the SmartThings Platform.
    This API allows you to package together and upload new drivers. As well as perform basic crud operations on
    already existing driver packages.
- name: Channels
  description: |
    Driver Channels are used to group SmartThings Edge Drivers and share access to them with other users.
    This API allows you to do basic CRUD operations on Channels as well as enrolling your hub into shared channels.
- name: HubDevices
  description: |
    An API for doing some basic interactions with hub devices
x-tagGroups:
- name: Locations
  tags:
  - Locations
  - Rooms
  - Modes
- name: Automations
  tags:
  - Rules
  - Scenes
- name: Devices
  tags:
  - Devices
  - Profiles
  - Preferences
  - Capabilities
  - Presentations
  - SchemaApps
  - InstalledSchemaApps
  - OAuth
  - Drivers
  - Channels
  - HubDevices
- name: Connected Services
  tags:
  - Apps
  - Installedapps
  - Schedules
  - Subscriptions
  - Coordinate
securityDefinitions:
  Bearer:
    description: |
      SmartThings resources are protected with HTTP Bearer authentication and OAuth2 scopes.
    type: oauth2
    authorizationUrl: https://auth-global.api.smartthings.com
    flow: implicit
    scopes:
      mobile: A user token
      service: A service token
      r:installedapps:*: |
        Read details about installed SmartApps, such as which Devices have been configured for the installation.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      l:installedapps: |
        View a list of installed SmartApps.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      w:installedapps:*: |
        Create, update, or delete installed SmartApps.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      r:apps:*: |
        Read details about a SmartApp.

        Only applicable for personal access tokens. Scope is limited to the SmartApps associated with the token's account.
      w:apps:*: |
        Create, update, or delete SmartApps.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      l:devices: |
        View a list of Devices.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      r:devices:*: |
        Read details about a Device, including Device attribute state.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token. This scope is required to create subscriptions.
      w:devices:*: |
        Update details such as the Device name, or delete a Device.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      x:devices:*: |
        Execute commands on a Device.

        For SmartApp tokens, the scope is restricted to the Location where the SmartApp is installed. For personal access tokens, the scope is limited to the account associated with the token.
      r:deviceprofiles: |
        View details of Device Profiles associated with the account.

        Only applicable for personal access tokens.
      w:deviceprofiles: |
        Create, update, or delete Device Profiles.

        Only applicable to personal access tokens. The Device Profile must be owned by the same account associated with the token.
      i:deviceprofiles: |-
        Create Devices of the type associated with the Device Profile.
        Only applicable for SmartApp tokens, and is requires the Device Profile and the SmartApp have the same account owner.
      r:rules:*: |
        Read details about a Rule. For personal access tokens, the scope is limited to the account associated with the token.
      w:rules:*: |
        Create, update or delete a Rule.

        For personal access tokens, the scope is limited to the account associated with the token.
      x:rules:*: |
        Execute a Rule.

        For personal access tokens, the scope is limited to the account associated with the token.
      r:scenes:*: |
        Read details about a Scene. For personal access tokens, the scope is limited to the account associated with the token.
      x:scenes:*: |
        Execute a Scene.

        For personal access tokens, the scope is limited to the account associated with the token.
      r:schedules: |
        Read details of scheduled executions.

        For SmartApp tokens, the scope is restricted to the installed SmartApp. For personal access tokens, the scope is limited to the account associated with the token.
      w:schedules: |
        Create, update, or delete schedules.

        For SmartApp tokens, the scope is restricted to the installed SmartApp. For personal access tokens, the scope is limited to the account associated with the token.
      l:locations: |
        View a list of Locations.

        Only applicable for personal access tokens. Scope is limited to the account associated with the token.
      r:locations:*: |
        Read details of a Location, such as geocoordinates and temperature scale.

        For SmartApp tokens, the scope is restricted to the installed SmartApp. For personal access tokens, the scope is limited to the account associated with the token.
      w:locations:*: |
        Create, update, and delete Locations.

        Only applicable for personal access tokens. Scope is limited to the account associated with the token.
      r:customcapability: |
        List capabilities in a namespace.

        For SmartApp tokens, the scope is restricted to the installed SmartApp. For personal access tokens, the scope is limited to the account associated with the token.
      w:customcapability: |
        Write capabilities and namespaces.

        For SmartApp tokens, the scope is restricted to the installed SmartApp. For personal access tokens, the scope is limited to the account associated with the token.
      r:hubs: Read Hubs
      x:locations:*: |
        Execute Mode changes on a Location
      r:security:locations:*:armstate: Read arm state in the given Location
      service:stdcp:backend: For internal use only
      r:devices: This scope is currently in BETA
      r:service:locations:modes: For internal use only
      r:customcapabilities:*: Deprecated; do not use.
      w:customcapabilities:*: Deprecated; do not use.
      service:duplo:customcapability: For internal use only
      r:hubs:*: |
        Read details about a hub, including hub state.

        For personal access tokens, the scope is limited to the account associated with the token.
      w:hubs:*: |
        Claim a new hub to your SmartThings account, update hub configuration, or delete a hub from your account.

        For personal access tokens, the scope is limited to the account associated with the token.
      r:drivers:*: |
        Read Lua drivers (SmartThings Edge Drivers) stored on a hub.

        For personal access tokens, the scope is limited to the account associated with the token.
      w:drivers:*: |
        Create, update, and delete Lua drivers (SmartThings Edge Drivers) stored on a hub.

        For personal access tokens, the scope is limited to the account associated with the token.
      r:channels:*: |
        Read SmartThings Edge Driver channels.

        For personal access tokens, the scope is limited to the account associated with the token.
      w:channels:*: |
        Read and update SmartThings Edge Driver channels.

        For personal access tokens, the scope is limited to the account associated with the token.
      r:invitations: Read Schema app invitations associated with the auth token's
        principal.
      w:invitations: Write Schema app invitations associated with the auth token's
        principal.
  Basic:
    type: basic
responses:
  notAuthenticated:
    description: Unauthorized
  notAuthorized:
    description: Forbidden
  notFound:
    description: Not found
    schema:
      $ref: '#/definitions/ErrorResponse'
    examples:
      application/json:
        requestId: 7b8514e6-230d-41cc-b3c2-512bca15abf0
        error:
          code: NotFoundError
          message: A resource could not be found.
          target: null
          details: [
            ]
  badRequest:
    description: Bad request
    schema:
      $ref: '#/definitions/ErrorResponse'
    examples:
      application/json:
        requestId: 7b8514e6-230d-41cc-b3c2-512bca15abf0
        error:
          code: BadRequestError
          message: The request is malformed.
          target: null
          details: [
            ]
  unprocessableEntity:
    description: Unprocessable Entity
    schema:
      $ref: '#/definitions/ErrorResponse'
    examples:
      application/json:
        requestId: 7b8514e6-230d-41cc-b3c2-512bca15abf0
        error:
          code: UnprocessableEntityError
          message: The request body is malformed.
          target: null
          details: [
            ]
  tooManyRequests:
    description: Too many requests
    schema:
      $ref: '#/definitions/ErrorResponse'
    examples:
      application/json:
        requestId: 7b8514e6-230d-41cc-b3c2-512bca15abf0
        error:
          code: TooManyRequestError
          message: Rate limit exceded.
          target: null
          details: [
            ]
  conflict:
    description: Conflict
    schema:
      $ref: '#/definitions/ErrorResponse'
    examples:
      application/json:
        requestId: 7b8514e6-230d-41cc-b3c2-512bca15abf0
        error:
          code: ConflictError
          message: A conflict occured that prevented action.
          target: null
          details: [
            ]
  defaultResponse:
    description: Unexpected error
    schema:
      $ref: '#/definitions/ErrorResponse'
    examples:
      application/json:
        requestId: 7b8514e6-230d-41cc-b3c2-512bca15abf0
        error:
          code: UnexpectedError
          message: A non-recoverable error condition occurred.
          target: null
          details: [
            ]
  unsupportedMediaType:
    description: Unsupported Media Type
