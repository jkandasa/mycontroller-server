    example: en
  PreferenceRequest:
    properties:
      preferenceId:
        type: string
        description: The ID of the preference. When explicit flag is true this field
          is required.
      name:
        description: An alphanumeric English language name for this preference. Will
          be appended to a namespace to generate the full preference id.
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9 ]{1,35}$
        example: tempOffset
      title:
        description: A short description for this preference.
        type: string
        example: Temperature Offset
      description:
        description: A long description for this preference.
        type: string
        example: The offset for a particular temperature setting
      explicit:
        description: A flag describing whether this preference is explicit, or inline.
          When set to true a preferenceId is required.
        type: boolean
        default: false
      required:
        description: A flag describing whether this property is required or not.
        type: boolean
        default: false
      preferenceType:
        $ref: '#/definitions/PreferenceType'
      definition:
        description: The definition of this preference.
        type: object
        properties:
          minimum:
            description: Minimum value a preference may be set to. Only valid for
              `integer` and `number` preference types.
            type: number
            format: double
          maximum:
            description: Maximum value a preference may be set to. Only valid for
              `integer` and `number` preference types.
            type: number
            format: double
          minLength:
            description: Minimum length a string may be set to. Only valid for `string`
              preference type.
            type: integer
          maxLength:
            description: Maximum length a string may be set to. Only valid for `string`
              preference type.
            type: integer
          default:
            description: Default value for a preference.
          stringType:
            description: The type of a string preference. `text` is a normal preference,
              `password` encrypts the values, and `paragraph` is for documentation
              purposes.
            type: string
            enum:
            - text
            - password
            - paragraph
          options:
            description: The available selections for an `enumeration` preference.
            type: object
            minProperties: 1
            additionalProperties:
              description: Key-Value pair mapping a key to a label. The key may be
                referenced in `translations` to support internationalization.
              type: string
    required:
    - name
    - title
    - preferenceType
    - definition
    example:
      title: Temperature Offset
      description: The offset for a particular temperature setting
      required: false
      preferenceType: number
      definition:
        minimum: -10.0
        maximum: 10.0
        default: 0.0
