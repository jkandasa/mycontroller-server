      deviceHealth:
        $ref: '#/definitions/DeviceHealthDetail'
      securityArmState:
        $ref: '#/definitions/SecurityArmStateDetail'
      hubHealth:
        $ref: '#/definitions/HubHealthDetail'
      sceneLifecycle:
        $ref: '#/definitions/SceneLifecycleDetail'
    required:
