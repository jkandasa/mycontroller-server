<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyController</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .banner {
      max-width: 28rem;
      margin: 1.5rem;
      padding: 2rem 1.75rem;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: #38bdf8;
    }
    p {
      margin: 0.5rem 0;
      line-height: 1.55;
      color: #cbd5e1;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      background: #0f172a;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>Web UI removed</h1>
    <p>The MyController web console is no longer bundled with this server.</p>
    <p>Please use the CLI tool <code>myc</code> to manage your MyController instance.</p>
  </div>
</body>
</html>
